# cargo-deny policy for zejtron (the sibling's supply-chain lineage,
# night-improve-12). Enforced by .github/workflows/audit.yml (the
# weekly observation run; corrected from the stale daily-and-release
# claim - the release lane carries no deny step, night-total-lts-2).
# Local: cargo deny check all (install: cargo install cargo-deny --locked).

[graph]
# The full dependency graph is small (3 direct deps: clap, aya,
# libc), but the policy still rides all-features=true by contract: if a
# feature is ever added, the graph it pulls is inside every
# advisories/licenses/bans check from day one - a policy that
# half-sees the tree is a policy that lies.
all-features = true

[output]
feature-depth = 1

[advisories]
# RustSec advisory database (default URL). No accepted advisories yet;
# when one is accepted (informational unmaintained-crate class, etc.),
# record it here with a reason string and mirror the rationale in
# docs/DEPENDENCY_AUDIT.md.
ignore = []

[licenses]
allow = [
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
# The allow list is intentionally broader than the current tree (e.g.
# BSD/ISC/MPL entries have no live consumers today) so a future
# semver-compatible transitive addition does not fail CI for license
# reasons alone - the bans/advisories sections stay strict.
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# Regressive dependencies - re-adding any of these fails
# `cargo deny check all` in CI:
# - chrono: dropped night-improve-13 (the sibling's Hinnant-style
#   lineage). The `clock` feature dragged iana-time-zone + num-traits
#   into the lockfile for two timestamp-formatting call sites;
#   wall-clock math is the civil_from_days algorithm in src/info/clock.rs
#   and build.rs (std only, UTC with an explicit marker). No time
#   crate comes back through the front door.
[[bans.deny]]
name = "chrono"
reason = "dropped night-improve-13 (Hinnant civil_from_days, std only); see src/info/clock.rs and Cargo.toml"

[[bans.deny]]
name = "iana-time-zone"
reason = "chrono's tz-database sidecar; denied with its host crate"

[[bans.deny]]
name = "time"
reason = "the other heavyweight time crate; the civil clock contract is std-only"

# Portfolio parity (2026-11-01): serde and serde_json join the ban
# list, matching zelynic's ruleset. The JSON lane is hand-written in
# src/evidence/json.rs (std-only, byte-deterministic, no crates exist
# only to move JSON) and the derive stack is not in the graph.
# The whole family is named explicitly (serde_core and serde_derive
# are split packages with their own names since serde 1.0.228, so
# banning serde alone leaves them reachable). The detached ebpf
# workspace is invisible to cargo-deny; scripts/gates/
# check-dep-bans.sh (gate-keepers section 20) reads every tracked
# Cargo.lock instead. It allows the serde family in ebpf/Cargo.lock
# only as upstream aya-ebpf's unconditional build-dependency chain
# (aya-build -> cargo_metadata -> serde/serde_json; host-side
# probe, never compiled into the bpfel-unknown-none object) and
# fails on anything else.
[[bans.deny]]
name = "serde"
reason = "hand-written JSON lane in src/evidence/json.rs; the derive stack is not in the graph"

[[bans.deny]]
name = "serde_json"
reason = "hand-written JSON parser + writer replace it"

[[bans.deny]]
name = "serde_core"
reason = "serde's split core package; banned with its host crate"

[[bans.deny]]
name = "serde_derive"
reason = "serde's proc-macro half; banned with its host crate"

# The arrayref incident tripwires (crates.io, 2026-08-20): the legitimate
# arrayref author's credentials were compromised and malicious new
# releases of the author's crates (arrayref@0.3.10, append-only-vec,
# internment) were republished with a dependency on the malicious
# proc-macro1, plus a typosquat cluster (proc-macro-en, aovine, arone,
# aronenao, tinymember) published in the same window. None of these
# names is in any lockfile of this repository today; they are banned
# so that a future resolution - a re-add through a transitive chain,
# a name-adjacent typo install - fails the check by name instead of
# passing silently. proc-macro2, the legitimate proc-macro crate in
# this repo's locks, is a different package and stays allowed.
[[bans.deny]]
name = "arrayref"
reason = "arrayref incident 2026-08-20: malicious republish under compromised author credentials; supply-chain tripwire"

[[bans.deny]]
name = "append-only-vec"
reason = "arrayref incident 2026-08-20: malicious release from the compromised author account; supply-chain tripwire"

[[bans.deny]]
name = "internment"
reason = "arrayref incident 2026-08-20: malicious release from the compromised author account; supply-chain tripwire"

[[bans.deny]]
name = "proc-macro1"
reason = "arrayref incident 2026-08-20: the malicious payload carrier; not proc-macro2, which stays allowed"

[[bans.deny]]
name = "proc-macro-en"
reason = "arrayref incident 2026-08-20: typosquat cluster of the incident window; supply-chain tripwire"

[[bans.deny]]
name = "aovine"
reason = "arrayref incident 2026-08-20: typosquat cluster of the incident window; supply-chain tripwire"

[[bans.deny]]
name = "arone"
reason = "arrayref incident 2026-08-20: typosquat cluster of the incident window; supply-chain tripwire"

[[bans.deny]]
name = "aronenao"
reason = "arrayref incident 2026-08-20: typosquat cluster of the incident window; supply-chain tripwire"

[[bans.deny]]
name = "tinymember"
reason = "arrayref incident 2026-08-20: typosquat cluster of the incident window; supply-chain tripwire"

[sources]
# The incident hardened both knobs from warn to deny: a dependency that
# resolves to any registry other than the official index, or to a git
# source nobody added deliberately, now FAILS `cargo deny check all`
# instead of printing a warning a weekly lane might not read.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
