#
# The fast lane: fmt + clippy + tests + the CLI battery on every
# push and pull request.
#
# Trigger discipline (the owner's unfiltered-CI simplification): the
# estate-wide path spelling is retired whole. Every push (any branch,
# any tag) and every pull request (any base) burns every lane - the
# filter's maintenance cost (the six-glob spelling kept in sync across
# every build workflow, the no-drift law between the push and
# pull_request blocks) cost more than the runner minutes it saved. A
# docs-only change now burns this lane too; the whole estate rides the
# same blind posture, and gate-keepers.yml polices the workflow lint
# this file's old workflow_quality job duplicated (gate-keepers.sh
# sections 2-4: yamllint, actionlint, codespell).
#
# The one deliberate exception lives outside this lane: the publish
# lanes (release.yml, crates-io.yml) are not blind - they keep their
# dedicated v* tag trigger, because a publish is the owner's
# deliberate act, never a consequence of an arbitrary change.
#
# The workflow_quality job is retired whole: it duplicated the
# gate-keepers CI lane (which runs unfiltered on every push and
# already owns actionlint, yamllint, and codespell with pinned
# versions) on an unpinned ad-hoc install. One lane, one owner.

---
name: zejtron - CI

"on":
  push:
  pull_request:

permissions:
  contents: read

# One run per ref: a new push supersedes the previous run's verdict
# (the sibling's concurrency shape, every workflow in the estate).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    # The display name says what the job runs (the sibling's
    # NIGHT-boost-11 lineage): a reader who wants the exact contract
    # copies the name straight into a terminal and gets the same gate
    # locally.
    name: build.sh check-all -q
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          components: rustfmt, clippy
          # The gate compiles the musl shape only (the night-badass-1
          # GNU purge completion): every cargo verb in build.sh
          # check-all is pinned to the release triple.
          targets: x86_64-unknown-linux-musl

      # The ebpf feature is the default (night-improve-5), so the
      # source-built lane runs on every check here - the tree's own
      # bootstrap installs the dated nightly pin and the pinned
      # bpf-linker (the zylaxion CI precedent), and ebpf/target rides
      # the runner cache so the nested build is warm after the first
      # run.
      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin

      - name: Install codespell
        run: python3 -m pip install --user codespell==2.4.3

      - name: Run checks
        run: ./scripts/build.sh check-all -q
