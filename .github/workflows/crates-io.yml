#
# The crates.io lane (the sibling's ship-set discipline, zejtron's
# pre-publication shape).
#
# zejtron is NOT published to the registry yet - the manifest's
# `documentation` field is withheld until the crate exists and the
# docs.rs tree is verified live (the sibling's rule: never pre-claim
# a link). This workflow owns the two things that stay true before
# and after publication:
#   1. The ship-set verification on the release tag:
#      `cargo package --list --locked` inventory + a full
#      `cargo package` dry run against the exact tree a release tag
#      names - the tarball is proven at the tree that would ship,
#      never against a moving branch head.
#   2. The on-demand publish: `workflow_dispatch` with publish=true
#      and CARGO_REGISTRY_TOKEN configured. The publish step refuses
#      to run without the explicit flag and the secret, so the dry-run
#      lane is the default posture and the actual publish stays the
#      owner's deliberate act.
#
# Trigger discipline (night-improve-33, the sibling's NIGHT-ask-1
# shape): the registry lane is a release artifact, not a per-push CI
# lane. It triggers on the owner-pushed release tag - the same `v*`
# filter release.yml carries - and never on code-surface pushes or
# pull requests: the fast lane (ci.yml) already owns those, and the
# estate-wide spelling this file briefly carried (night-improve-32)
# blurred the two lanes' contracts.

name: zejtron - crates.io publish

'on':
  push:
    tags:
      # night-improve-33 (the sibling's NIGHT-ask-1 shape): the
      # registry lane wakes on the owner-pushed release tag - the
      # same 'v*' filter release.yml carries - so the ship-set
      # verification proves the tarball at the exact tree that
      # would publish. Code-surface pushes and pull requests are
      # the fast lane's territory (ci.yml); the estate-wide
      # spelling this file briefly carried (night-improve-32) was
      # a publish contract blurred into a build lane.
      - 'v*'
  # The manual lane stays (zejtron's pre-publication posture): the
  # FIRST publish cannot wait for a tag the crate name does not
  # back yet - the owner dispatches with publish=true once the
  # registry token is configured. The publish job's own guards
  # (the explicit input flag plus the configured secret) keep the
  # dry-run the default posture of every run.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Actually publish to crates.io (requires CARGO_REGISTRY_TOKEN secret)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  ship-set:
    name: Registry ship-set verification (package dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: "1.98.1"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin
        with:
          cache-on-failure: true

      # The curated-include contract: the tarball carries exactly the
      # compile surface + the top-level docs + the governance set and
      # nothing else. The inventory is asserted, not trusted.
      - name: Verify the ship-set inventory
        run: |
          set -euo pipefail
          LIST=$(cargo package --list --locked 2>/dev/null)
          for required in \
            Cargo.toml Cargo.lock build.rs rust-toolchain.toml README.md \
            LICENSE NOTICE deny.toml CHANGELOG.md TRADEMARK.md \
            CLA.md COMMERCIAL_LICENSE.md CONTRIBUTING.md SECURITY.md QA.md \
            docs/DEPENDENCY_AUDIT.md docs/LICENSING_FAQ.md \
            src/main.rs src/info/clock.rs src/info/mod.rs; do
            if ! grep -qx "${required}" <<<"${LIST}"; then
              echo "::error::ship-set missing required entry: ${required}"
              exit 1
            fi
          done
          # The repo-only lanes must never ride the tarball.
          for forbidden in "scripts/" "assets/" ".github/"; do
            if grep -q "^${forbidden}" <<<"${LIST}"; then
              echo "::error::ship-set leaked repo-only lane: ${forbidden}"
              exit 1
            fi
          done
          echo "ship-set verified: $(grep -c . <<<"${LIST}") files"

      # The full dry run: builds the package the registry would
      # receive (including the build script's no-.git degradation).
      - name: Package dry run
        run: cargo package --locked --allow-dirty

  publish:
    name: Publish to crates.io (owner-gated)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [ship-set]
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: "1.98.1"

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN secret not configured - refusing to publish"
            exit 1
          fi
          cargo publish --locked
