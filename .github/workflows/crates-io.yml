#
# The crates.io lane (the sibling's tag-means-publish contract,
# zelynic's NIGHT-ask-1 shape).
#
# night-improve-58: one trigger, one act - the owner-pushed release
# tag IS the publish command. The same 'v*' filter release.yml
# carries wakes this lane; the ship-set verification runs first
# (the `cargo package --list --locked` inventory plus a full
# `cargo package` dry run against the exact tree the tag names -
# the tarball is proven at the tree that ships, never against a
# moving branch head), and the publish job uploads straight after.
# The manual workflow_dispatch lane is retired: pushing a tag is
# the owner's deliberate act, and the idempotency probe below
# makes every accidental re-entry safe (crates.io rejects
# duplicate versions, so an already-published version skips the
# upload instead of failing).
#
# Safety properties (the sibling's ship-set):
#   - Fails fast if the tag does not match Cargo.toml's version
#     (./scripts/dev/version-to.sh is the bump tool).
#   - Fails fast without the CRATES_IO_TOKEN repository secret
#     (the cargo-side variable the lane derives from it is
#     CARGO_REGISTRY_TOKEN - the mapping lives in the workflow).
#   - Idempotent: a re-pushed tag or a re-run skips an
#     already-published version.
#   - --locked: the published dependency set is exactly the tagged
#     Cargo.lock, the same tree every other CI job validated.
#   - cancel-in-progress: false - an in-flight registry upload is
#     never cancelled mid-flight.
#
# One-time setup (owner): create a crates.io API token
# (crates.io -> Account Settings -> API Tokens, "publish-new"
# scope is enough) and add it as the CRATES_IO_TOKEN repository
# secret (repo Settings -> Secrets and variables -> Actions).
#
# Code-surface pushes and pull requests never wake this lane - the
# fast lane (ci.yml) owns those.

name: zejtron - crates.io publish

'on':
  push:
    tags:
      # The registry lane wakes on the owner-pushed release tag -
      # the same 'v*' filter release.yml carries - and the tag
      # itself is the publish command (night-improve-58).
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A registry upload is irreversible (a bad version can only be
  # yanked, never replaced): a second tag landing mid-publish must
  # wait its turn, never kill the in-flight one.
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  ship-set:
    name: Registry ship-set verification (package dry run)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: "1.98.1"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin
        with:
          cache-on-failure: true

      # The curated-include contract: the tarball carries exactly the
      # compile surface + the top-level docs + the governance set and
      # nothing else. The inventory is asserted, not trusted.
      - name: Verify the ship-set inventory
        run: |
          set -euo pipefail
          LIST=$(cargo package --list --locked 2>/dev/null)
          for required in \
            Cargo.toml Cargo.lock build.rs rust-toolchain.toml README.md \
            LICENSE NOTICE deny.toml CHANGELOG.md TRADEMARK.md \
            CLA.md COMMERCIAL_LICENSE.md CONTRIBUTING.md SECURITY.md QA.md \
            docs/DEPENDENCY_AUDIT.md docs/LICENSING_FAQ.md \
            src/main.rs src/info/clock.rs src/info/mod.rs \
            ebpf-prebuilt/zejtron-ebpf.o ebpf-prebuilt/manifest.toml; do
            if ! grep -qx "${required}" <<<"${LIST}"; then
              echo "::error::ship-set missing required entry: ${required}"
              exit 1
            fi
          done
          # The repo-only lanes must never ride the tarball.
          for forbidden in "scripts/" "assets/" ".github/"; do
            if grep -q "^${forbidden}" <<<"${LIST}"; then
              echo "::error::ship-set leaked repo-only lane: ${forbidden}"
              exit 1
            fi
          done
          echo "ship-set verified: $(grep -c . <<<"${LIST}") files"

      # The full dry run: builds the package the registry would
      # receive (including the build script's no-.git degradation).
      - name: Package dry run
        run: cargo package --locked --allow-dirty

  publish:
    name: Publish to crates.io (${{ github.ref_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [ship-set]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: "1.98.1"

      # The tag names the version: drift between the pushed tag and
      # the manifest fails the lane before anything is uploaded.
      - name: Verify tag matches Cargo.toml version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${TAG_VERSION}" != "${CARGO_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${CARGO_VERSION}"
            echo "Bump the package version before tagging: ./scripts/dev/version-to.sh ${TAG_VERSION}"
            exit 1
          fi
          echo "Publishing zejtron ${CARGO_VERSION} to crates.io"

      - name: Publish
        env:
          # The repository secret is CRATES_IO_TOKEN (the zelynic
          # estate's name for it); cargo's native publish variable is
          # CARGO_REGISTRY_TOKEN, so the mapping lives here and
          # nowhere else.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CRATES_IO_TOKEN repository secret is not set."
            echo "Create a crates.io API token (crates.io -> Account Settings -> API Tokens)"
            echo "and add it under repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # Idempotency probe: crates.io rejects duplicate versions, so
          # a re-pushed tag (or a re-run) must not attempt a second
          # upload. The API requires a custom User-Agent (plain curl
          # gets 403) and the retry contract - a transient 5xx reading
          # as "not published" would fall through to cargo publish and
          # die as a duplicate-version error, the exact
          # infra-flake-looks-like-code-failure trap the sibling's
          # NIGHT-dinner-12 closed.
          if curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 \
              -A "zejtron-ci-publish-check" \
              "https://crates.io/api/v1/crates/zejtron/${VERSION}" >/dev/null 2>&1; then
            echo "zejtron ${VERSION} is already published on crates.io - nothing to do."
            exit 0
          fi
          cargo publish --locked
