#
# The release lane (the sibling's mature shape, zejtron's two-leg
# matrix). On a v* tag push:
#
#   validate -> build (2 legs: linux-amd64-{v3,v4}, fully static musl) -> release
#
# - The matrix is the AMD64 x86-64-v3/v4 microarch levels, both fully
#   static musl - the only shapes zejtron supports and optimizes for
#   (night-badass-1 retired the gnu pair; the native v1 baseline stays
#   a local dev-only build via the pro-native-musl alias). Each leg's
#   RUSTFLAGS is the build contract;
#   the tripwire step pins the exact flag set per platform id, and
#   the same tokens live in .cargo/config.toml's arch-baseline
#   aliases so a local alias build reproduces the release tier.
# - Every tarball ships with SHA-512 + BLAKE3 + SHAKE256
#   (quantum-resistant) checksums, and - when the GPG secrets are
#   configured - a detached ASCII-armored signature, imported, signed,
#   and verified inside the build job (the least-privilege placement:
#   the private key never enters the publishing job's environment).
# - The release body renders through scripts/release/
#   generate-release-notes.sh (single source of truth, self-tested
#   before the body renders), with the asset-inventory tripwire ahead
#   of the publish step - a green pipeline can never ship an
#   asset-less release (the sibling's NIGHT-dinner-3 lesson).

name: zejtron - Release

"on":
  push:
    tags:
      - v*
  # night-improve-31 (the sibling's recovery lane): a dispatch on the
  # tag ref re-runs the whole pipeline - validate, all four builds,
  # publish - WITHOUT re-pushing anything, so a mid-flight red (a
  # transient API 5xx, a runner hiccup) heals with one click instead
  # of delete-and-re-push the tag. In the Run workflow dialog pick
  # the tag under "Use workflow from"; every job derives its facts
  # from GITHUB_REF_NAME, so a tag-ref dispatch is byte-identical to
  # the push run.
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a re-pushed or re-dispatched tag supersedes the
# previous run (the sibling's moved-tag protection shape).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Derive the release facts from the tag
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The strict gate (night-total-lts-2): the case below only
          # classifies the pre-release split; it was never a
          # validator. A glob * crosses dots, semicolons and quotes,
          # so a crafted refname rode its * into the build jobs'
          # string interpolations. Only a strict vX.Y.Z(-SUFFIX)
          # refname reaches the release lane.
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'; then
            echo "::error::tag ${TAG} is not a strict v-prefixed semver (vX.Y.Z or vX.Y.Z-suffix)"
            exit 1
          fi
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*)
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
              ;;
            v[0-9]*.[0-9]*.[0-9]*-*)
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::tag ${TAG} is not a v-prefixed semver ( vX.Y.Z or vX.Y.Z-prerelease )"
              exit 1
              ;;
          esac
          echo "validated: ${TAG}"

  build:
    name: Build Release Binary (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    needs: [validate]
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64-v3-musl
            target: x86_64-unknown-linux-musl
            rustflags: "-D warnings -C target-cpu=x86-64-v3 -C target-feature=+crt-static"
            install_packages: musl-tools b3sum
          - platform: linux-amd64-v4-musl
            target: x86_64-unknown-linux-musl
            rustflags: "-D warnings -C target-cpu=x86-64-v4 -C target-feature=+crt-static"
            install_packages: musl-tools b3sum

    env:
      TAG: ${{ needs.validate.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install system packages
        if: matrix.install_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.install_packages }}

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      # The ebpf feature is the default (night-improve-5): every leg's
      # build source-builds the kernel object host-side (the target
      # triple does not change the build script's host), so each leg
      # installs the prerequisites (the zylaxion CI precedent). The
      # nested build inherits the leg's -D warnings rustflags (the
      # poison strip keeps the lint, drops the host-cpu token, and
      # re-forces the v3 codegen level) - the tap source is held to
      # the same warning-free bar as the host crate.
      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin
        with:
          key: release-${{ matrix.platform }}
          prefix-key: release

      # cosmostrix tripwire: the matrix rustflags ARE the build
      # contract - a platform whose flag set drifts fails here, not in
      # a shipped binary's performance profile.
      - name: Verify arch-baseline inputs
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux-amd64-v3-musl) expected="-D warnings -C target-cpu=x86-64-v3 -C target-feature=+crt-static" ;;
            linux-amd64-v4-musl) expected="-D warnings -C target-cpu=x86-64-v4 -C target-feature=+crt-static" ;;
            *) echo "::error::Unknown platform id ${{ matrix.platform }}"; exit 1 ;;
          esac
          if [ "${{ matrix.rustflags }}" != "${expected}" ]; then
            echo "::error::${{ matrix.platform }} must use RUSTFLAGS='${expected}', got '${{ matrix.rustflags }}'"
            exit 1
          fi
          echo "arch-baseline inputs verified: ${{ matrix.platform }}"

      # The v3-musl leg carries the full gate (fmt/clippy/test/battery);
      # the other leg builds only - its shape difference IS the
      # product being released, and the v3 leg already vetted the
      # source. check-all hard-requires codespell (build.sh's
      # check_command gate), and the runner image does not carry it -
      # the fast lane installs the same pinned version before its own
      # check-all run; this leg needs the same install.
      - name: Install codespell
        if: matrix.platform == 'linux-amd64-v3-musl'
        run: python3 -m pip install --user codespell==2.4.3

      - name: Run full checks
        if: matrix.platform == 'linux-amd64-v3-musl'
        run: ./scripts/build.sh check-all

      # NIGHT-strict-2's tier rustflags are the product build contract,
      # STEP-scoped here - never job-level (the sibling's NIGHT-improve-22
      # shape, zelynic release.yml). History: when these flags rode the
      # job env, the host-side gate died before a single crate compiled -
      # cargo refuses to produce clap_derive's proc-macro for a
      # crt-static host triple ("does not support these crate types") -
      # the exact death the v80.0.0-alpha.2 and v80.0.0-beta.1 tag runs
      # documented at the b3sum install (scripts/dev/bootstrap-ebpf.sh)
      # and the v80.0.0-rc.4 release run repeated in "Run full checks".
      # The gate itself is musl-pinned now (build.sh check-all passes
      # --target on every cargo verb, the GNU purge completion), but the
      # scoping stays step-level by contract: env rustflags ride the
      # musl target units only, host proc-macros and build scripts
      # compile flag-free (verified on the pinned 1.98.1 toolchain),
      # and the nested eBPF build still inherits the leg's -D warnings
      # through build/ebpf.rs's poison strip (the lint token survives
      # it verbatim).
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          set -Eeuo pipefail
          PKG="zejtron-${TAG}-${{ matrix.platform }}"
          STAGE="dist/stage"
          mkdir -p "${STAGE}"
          cp "target/${{ matrix.target }}/release/zejtron" "${STAGE}/"
          chmod +x "${STAGE}/zejtron"
          cp README.md LICENSE "${STAGE}/"
          tar -czf "dist/${PKG}.tar.gz" -C "${STAGE}" zejtron LICENSE README.md
          ACTUAL=$(tar -tzf "dist/${PKG}.tar.gz" | sort | tr '\n' ' ')
          if [ "${ACTUAL}" != "LICENSE README.md zejtron " ]; then
            echo "tarball invariant violated for ${PKG}: ${ACTUAL}"
            exit 1
          fi
          rm -rf "${STAGE}"
          cd dist
          # Checksums: SHA-512 (classical) + BLAKE3 (the fast modern
          # lane, the official b3sum utility) + SHAKE256 (quantum-resistant)
          sha512sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha512sum"
          b3sum "${PKG}.tar.gz" > "${PKG}.tar.gz.b3sum"
          # SHAKE256 via Python (cross-platform, consistent 64-byte output)
          # PKG rides argv, never string interpolation
          # (night-total-lts-2): a name is data, not code - the old
          # inline form let a quote in the name break out of the
          # Python string.
          python3 -c "
          import hashlib, sys
          data = open(sys.argv[1], 'rb').read()
          h = hashlib.shake_256(data).hexdigest(64)
          print(h + '  ' + sys.argv[1])
          " "${PKG}.tar.gz" > "${PKG}.tar.gz.shake256"

          echo ""
          echo "=== Release artifacts ==="
          ls -lh

      # =========================================================================
      # Detached ASCII-armored GPG signatures for every release tarball.
      #
      # Placement: signing runs HERE, in the build job, which holds no
      # `contents: write` token (top-level default is read). The private
      # key therefore never enters the environment of the job that
      # publishes the GitHub release - least privilege for the most
      # sensitive secret in the pipeline.
      #
      # Contract: when the GPG_PRIVATE_KEY secret is not configured,
      # both steps no-op and the release ships checksums-only - no
      # release is ever blocked on signing configuration.
      #
      # Passphrase confinement: the passphrase NEVER enters
      # GITHUB_ENV. The import step keeps it in step-scoped env +
      # stdin (--passphrase-fd 0, never a command line), the sign
      # step re-reads it from secrets directly in its own step env,
      # and the only value that crosses steps is GPG_KEY_ID - a
      # public key id, not a secret.
      # =========================================================================
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "GPG_PRIVATE_KEY secret not configured - skipping GPG signing"
            exit 0
          fi
          # Import the armored private key. --batch + --yes prevents
          # interactive prompts. --pinentry-mode loopback allows
          # passwordless import for keys without passphrase protection.
          # With a passphrase, it arrives via --passphrase-fd 0 (stdin)
          # so it never appears in a process listing or command line.
          if [ -n "${GPG_PASSPHRASE}" ]; then
            echo "${GPG_PASSPHRASE}" | gpg --import --batch --yes \
              --pinentry-mode loopback \
              --passphrase-fd 0 \
              <(echo "${GPG_PRIVATE_KEY}")
          else
            echo "${GPG_PRIVATE_KEY}" | gpg --import --batch --yes \
              --pinentry-mode loopback
          fi
          # Show what was imported (key IDs only, no secrets). Extract
          # the signing-capable key id: ssb/sec rows whose capability
          # field carries S, with the any-secret fallback for gpg
          # versions that populate the field differently.
          gpg --list-secret-keys --with-colons || true
          KEY_ID="$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^(ssb|sec):/ && $12 ~ /S/ {print $5; exit}')"
          if [ -z "${KEY_ID}" ]; then
            KEY_ID="$(gpg --list-secret-keys --with-colons \
              | awk -F: '/^(ssb|sec):/ {print $5; exit}')"
          fi
          if [ -z "${KEY_ID}" ]; then
            echo "::error::Failed to import GPG secret key (no signing-capable key found)"
            echo "::error::gpg --list-secret-keys output:"
            gpg --list-secret-keys 2>&1 || true
            exit 1
          fi
          echo "GPG_KEY_ID=${KEY_ID}" >> "$GITHUB_ENV"
          echo "Imported GPG signing key: ${KEY_ID}"

      - name: Sign artifacts (detached GPG signatures)
        if: env.GPG_KEY_ID != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Sign every .tar.gz with a detached ASCII-armored signature.
          # Idempotent: skip files that already have an .asc sibling so
          # workflow re-runs never re-sign (stable artifact bytes).
          # Passphrase (if any) flows via --passphrase-fd 0 from stdin -
          # never via the command line.
          find . -type f -name '*.tar.gz' -print0 \
            | while IFS= read -r -d '' artifact; do
                if [ -f "${artifact}.asc" ]; then
                  echo "  (existing sig) ${artifact}.asc"
                  continue
                fi
                echo "  signing ${artifact}"
                if [ -n "${GPG_PASSPHRASE}" ]; then
                  echo "${GPG_PASSPHRASE}" | gpg --batch --yes --detach-sign --armor \
                      --local-user "${GPG_KEY_ID}" \
                      --pinentry-mode loopback \
                      --passphrase-fd 0 \
                      --output "${artifact}.asc" "${artifact}"
                else
                  gpg --batch --yes --detach-sign --armor \
                      --local-user "${GPG_KEY_ID}" \
                      --pinentry-mode loopback \
                      --output "${artifact}.asc" "${artifact}"
                fi
              done
          # Tripwire: every tarball must have an .asc sibling, and every
          # signature must verify against the imported key BEFORE
          # upload. A release never ships a broken or missing signature
          # once signing is configured.
          TARBALLS=$(find . -type f -name '*.tar.gz' | wc -l)
          SIGS=$(find . -type f -name '*.tar.gz.asc' | wc -l)
          if [ "${TARBALLS}" -ne "${SIGS}" ]; then
            echo "::error::Signature coverage broken: ${TARBALLS} tarballs, ${SIGS} signatures"
            exit 1
          fi
          find . -type f -name '*.tar.gz' -print0 \
            | while IFS= read -r -d '' artifact; do
                echo "  verifying ${artifact}.asc"
                gpg --batch --verify "${artifact}.asc" "${artifact}" 2>&1 \
                  | grep -q "Good signature" \
                  || { echo "::error::gpg --verify failed for ${artifact}"; exit 1; }
              done
          echo "--- Signed artifacts ---"
          find . -name '*.asc' -print | sort
          echo "--- All signatures verified ---"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7, SHA pin
        with:
          # One artifact per platform; the release job merges the four
          # by pattern (merge-multiple) so GPG signing stays in the
          # build-class jobs while the matrix scales.
          name: release-artifacts-${{ matrix.platform }}
          path: dist/*
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [validate, build]
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
    steps:
      # STEP ORDER: checkout runs BEFORE the artifact download. The
      # checkout's default clean wipes the workspace - under the
      # download-first order it destroys the freshly fetched dist/
      # and softprops' unmatched-glob warning ships an asset-less
      # release (the sibling's NIGHT-dinner-3 incident, green
      # pipeline, zero assets). Checkout first, download second.
      - name: Checkout release tooling (sparse, depth 1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/release
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8, SHA pin
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: dist

      # TRIPWIRE: assert the dist/ inventory BEFORE the publish step.
      # The build matrix is two legs (v3/v4, fully static musl -
      # night-badass-1 retired the gnu pair); each Prepare
      # step emits one tarball plus three checksum files, and the build
      # job's signature-coverage tripwire makes GPG signing
      # all-or-nothing - so the legal shapes here are exactly: 2
      # tarballs + 6 checksums + (0 or 2) signatures. Anything else is
      # a red pipeline with the precise missing file named, never a
      # silently asset-less release.
      - name: Assert release asset inventory
        run: |
          set -euo pipefail
          TARBALLS=$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)
          if [ "${TARBALLS}" -ne 2 ]; then
            echo "::error::Expected 2 release tarballs in dist/ (the build matrix legs), found ${TARBALLS}"
            find dist -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          BROKEN=0
          for f in dist/*.tar.gz; do
            for suffix in sha512sum b3sum shake256; do
              if [ ! -f "${f}.${suffix}" ]; then
                echo "::error::Missing checksum sibling ${f}.${suffix}"
                BROKEN=1
              fi
            done
          done
          SIGS=$(find dist -maxdepth 1 -type f -name '*.tar.gz.asc' | wc -l)
          if [ "${SIGS}" -ne 0 ] && [ "${SIGS}" -ne "${TARBALLS}" ]; then
            echo "::error::Partial GPG coverage: ${SIGS} signatures for ${TARBALLS} tarballs"
            echo "(signing is all-or-nothing)"
            BROKEN=1
          fi
          if [ "${BROKEN}" -ne 0 ]; then
            exit 1
          fi
          echo "dist/ inventory verified: ${TARBALLS} tarballs, ${SIGS} GPG signatures,"
          echo "$(( TARBALLS * 3 )) checksum files"

      - name: Generate release body
        id: body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The self-binding keeps the job-level TAG env visible to
          # the shellcheck pass actionlint runs on this script
          # (without it every ${TAG} read below reads as an
          # unassigned variable); the disable is the directive for
          # the no-op assignment.
          # shellcheck disable=SC2269
          TAG="${TAG}"
          IS_PRERELEASE="${{ needs.validate.outputs.prerelease }}"

          # Bounded retry for the API reads below: a just-pushed tag
          # occasionally answers its first requests with a transient
          # 5xx. Three attempts, five seconds apart, then the real
          # error surfaces unchanged.
          gh_api() {
            local attempt out
            for attempt in 1 2 3; do
              if out=$(gh api "$@"); then
                printf '%s\n' "$out"
                return 0
              fi
              echo "gh api attempt ${attempt} failed - retrying in 5s" >&2
              sleep 5
            done
            return 1
          }

          # All tag names via the API - no clone, no local refs. The
          # previous-changelog boundary: pre-releases diff from the
          # nearest prior tag; stables skip pre-releases. awk (never
          # grep) so a zero-match filter is not a failed pipeline
          # under pipefail.
          TAGS=$(gh_api --paginate "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name')
          if [ "${IS_PRERELEASE}" = "true" ]; then
            PREV_TAG=$(printf '%s\n' "${TAGS}" \
              | awk -v cur="${TAG}" '$0 != cur' \
              | sort -V | tail -1)
          else
            PREV_TAG=$(printf '%s\n' "${TAGS}" \
              | awk -v cur="${TAG}" \
                '$0 != cur && $0 !~ /^v[0-9]+\.[0-9]+\.[0-9]+-(dev|nightly|alpha|beta|rc)[\.-]/' \
              | sort -V | tail -1)
          fi

          COMPARE_JSON=""
          if [ -n "${PREV_TAG}" ]; then
            gh_api "repos/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}" > compare.json
            COMPARE_JSON=compare.json
          fi

          # The family release-page style, one implementation in the
          # tree: scripts/release/generate-release-notes.sh (its header
          # carries the design notes; --self-test pins the classifier
          # battery and the body shape, rootless). The battery runs
          # first - milliseconds, and a drifted classifier fails the
          # pipeline BEFORE a broken body publishes, not after.
          scripts/release/generate-release-notes.sh --self-test

          scripts/release/generate-release-notes.sh \
            --tag "${TAG}" \
            --prerelease "${IS_PRERELEASE}" \
            --compare-json "${COMPARE_JSON}" \
            --prev-tag "${PREV_TAG}" \
            > release-body.md

          # Release title: the bare tag name (the family convention) -
          # GitHub's own Pre-release badge marks the channel in the
          # releases list, and the body's WARNING callout carries the
          # expectation-setting text.
          echo "title=${TAG}" >> "$GITHUB_OUTPUT"

          echo "=== Release body ==="
          cat release-body.md

          # Platform tripwire: GitHub silently truncates a stored
          # release body over ~125,000 characters. The generator owns
          # the policy budget and refuses over-budget bodies itself;
          # this check is the independent guard on the exact file the
          # publish step uploads.
          BODY_BYTES=$(wc -c < release-body.md | tr -d ' ')
          if [ "${BODY_BYTES}" -gt 124000 ]; then
            echo "::error::Release body is ${BODY_BYTES} bytes - over the 124,000-byte platform cap."
            echo "Refusing to publish a body GitHub would silently truncate."
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3, SHA pin
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: ${{ steps.body.outputs.title }}
          body_path: release-body.md
          files: dist/*
          # Seatbelt: an unmatched `files:` glob FAILS the release
          # instead of logging the warning that ships asset-less
          # releases. The inventory tripwire above gives the precise
          # diagnosis; this makes the third-party action itself refuse
          # the silent path.
          fail_on_unmatched_files: true
          draft: false
          # Pre-releases are never marked "latest" - the latest pointer
          # only tracks stable releases.
          prerelease: ${{ needs.validate.outputs.prerelease }}
          make_latest: ${{ needs.validate.outputs.prerelease != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
