#
# The fuzz lane (night-improve-43): continuous proof that zejtron's
# three critical input-parsing surfaces cannot be broken into a panic.
# zejtron reads bytes from the kernel (/sys/kernel/btf/vmlinux) and
# from /proc - bytes a malicious or corrupted host controls - and the
# reliability claim is only honest if it is tested against hostile
# input, not just the happy path. One cargo-fuzz target per surface:
#
# - btf_parser:       the BTF parser (src/ebpf/btf.rs), the host's own
#                     vmlinux driven through parse_btf_offsets and
#                     verify_writev_symbol_in;
# - proc_parser:      the /proc and /etc raw parsers
#                     (src/system/mod.rs) - the cmdline byte grammar
#                     plus the passwd/status/cgroup string grammars;
# - sanitize_display: the terminal-safety neutralizer, asserted to let
#                     no control character survive (the CWE-150 gate)
#                     and to leave honest data byte-identical.
#
# The harnesses path-include the parser sources (see fuzz/Cargo.toml):
# the fuzzer compiles the same bytes the binary ships, so a guarantee
# the lane proves is a guarantee the binary carries. The eBPF
# kernel-side code is deliberately not fuzzed - it runs behind the
# kernel verifier, not in userspace.
#
# Nightly is the fuzzer's standard toolchain (cargo-fuzz builds the
# harness with the libFuzzer runtime); the main crate's stable pin in
# rust-toolchain.toml is untouched - the env-var override below is
# scoped to this lane's cargo invocations, including the nested ones
# cargo-fuzz spawns. Each target runs for a bounded 60 seconds per
# push: the lane's job is the regression net (a crash fails CI with
# the input in the log), not exhaustive coverage - depth comes from
# the corpus that accumulates between runs via the cache. A found
# crash is a parser bug: fix the parser to return the named error,
# never the panic.
#
# The committed seed anchors (night-improve-50): fuzz/seeds/ carries
# hand-built BTF blobs - the 6.18 unnamed-union shape, a two-level
# anonymous nest, and the direct-member + vfs_writev shape - that
# the lane copies into the working corpus before every run, so the
# fuzzer starts inside the anonymous-descent paths (night-improve-49)
# from run one instead of spending its budget rediscovering a valid
# BTF header byte by byte. The grown corpus still stays out of git
# (fuzz/.gitignore); the seeds are the lane's definition, the same
# law as the targets and the manifests.
#
# The daily sweep (night-T-1): the scheduled session runs every day
# at 07:30 WIB (00:30 UTC) with a 180-second budget per target - not
# the old weekly 15-minute deep blob. The estate law is five minutes
# per job, and a 900-second burn plus build overhead blew straight
# through it (measured 15-16 minute scheduled runs, 2026-11-09). The
# daily sweep beats the weekly blob on its own terms: 7 x 180s = 1260
# seconds of fuzzing per target per week (+40% depth) and the corpus
# is never more than a day old, while every job's wall clock lands
# near four minutes. The corpus cache restores the accumulated corpus
# under the same restore-keys, so every session grows one asset; a
# scheduled run and a push on the same ref share the concurrency
# group, the newer run wins (the estate shape).

---
name: zejtron - Fuzz

"on":
  push:
  pull_request:
  schedule:
    # The daily sweep: every day 00:30 UTC = 07:30 WIB (night-T-1).
    - cron: "30 0 * * *"

permissions:
  contents: read

# One run per ref: a new push supersedes the previous run's verdict
# (the sibling's concurrency shape, every workflow in the estate).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fuzz:
    # The budget rides the event (the Fuzz step's table): 60s on
    # push and PR, 180s on the daily sweep (night-T-1).
    name: cargo fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    # The five-minute law, sized as a fail-fast line: a warm run
    # lands near four minutes, so 10 gives the honest ceiling before
    # a runaway build burns the runner (the miri lane's sizing
    # formula, the sibling contract).
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [btf_parser, proc_parser, sanitize_display]
    env:
      # The fuzzer's toolchain, set by environment rather than by
      # `+nightly` on the command line: cargo-fuzz re-invokes cargo
      # internally, and this is the one override rustup honors through
      # every nested invocation - the repo-root rust-toolchain.toml
      # (the stable pin the main crate's lanes ride) cannot leak into
      # the fuzz build.
      RUSTUP_TOOLCHAIN: nightly

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04  # @nightly, SHA pin

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin
        with:
          # Only the fuzz workspace rides this lane's cache: the
          # harnesses path-include the parser sources, so the root
          # crate (its dependencies, its build script) is never built
          # here at all.
          workspaces: fuzz

      - name: Restore the fuzz corpus cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, SHA pin
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # The run id keys a fresh save per run; the restore keys
          # pull the latest accumulated corpus from any prior run, so
          # the fuzzer keeps growing where the last one stopped.
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # The committed anchors (night-improve-50): copied into the
      # corpus AFTER the cache restore, so the seeds ride every
      # session - push or weekly - and land in the cache the run
      # saves. A target without a seeds directory is named honestly;
      # the corpus cache still applies.
      - name: Seed the corpus from the committed anchors
        run: |
          if [ -d "fuzz/seeds/${{ matrix.target }}" ]; then
            mkdir -p "fuzz/corpus/${{ matrix.target }}"
            cp "fuzz/seeds/${{ matrix.target }}"/* "fuzz/corpus/${{ matrix.target }}"/
            echo "seeded $(find "fuzz/seeds/${{ matrix.target }}" -type f | wc -l) committed anchor(s) into the corpus"
          else
            echo "no committed anchors for ${{ matrix.target }} - the corpus cache still applies"
          fi

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz
        run: |
          # The budget table: 60s on every push and pull request (the
          # regression net), 180s on the daily sweep (the corpus
          # grows every day; the estate law keeps each job's wall
          # clock under five minutes).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            BUDGET=180
          else
            BUDGET=60
          fi
          echo "fuzz budget: ${BUDGET}s (event: ${{ github.event_name }})"
          cargo fuzz run ${{ matrix.target }} \
            -- -max_total_time="${BUDGET}" -rss_limit_mb=4096 -timeout=25
