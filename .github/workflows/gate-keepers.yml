#
# Gate-keepers - the one wholesale gate workflow (the sibling's
# NIGHT-hunt-23 class closure lineage): this workflow runs
# scripts/gate-keepers.sh wholesale on EVERY push and PR with NO
# filters at all (the owner's unfiltered-CI simplification retired
# the branch scoping together with the estate's path filters) - a
# docs-only or workflow-only change never skips the gates that
# police it.
#
# Checks performed by gate-keepers.sh (18 sections: the pre-commit
# self-install seat plus 17 numbered gates):
#    0. Pre-commit hook self-install
#    1. Shell quad (bash -n, shellcheck, shfmt, source resolution)
#    2. yamllint       3. actionlint      4. TOML syntax
#    5. codespell      6. SPDX headers   7. permissions (644/755)
#    8. emoji sweep    9. .rs LOC cap   10. toolchain pin sync
#   11. language      12. scripts LOC   13. version anti-patterns
#   14. release parity (alias == matrix rustflags)
#   15. family name case (zylaxion lowercase law)
#   16. prebuilt pin parity (the --check verdict, fail-closed)
#   17. actions-pin freshness (the --strict sweep, fail-closed on
#       a KNOWN-stale tag pin; every skip reason stays a skip)
#
# Every tool below is installed and pinned - a check that silently
# skips because its tool is missing is a check that does not exist.

name: zejtron - Gate-keepers

'on':
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  gatekeepers:
    name: Gate-keepers (wholesale)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      # Tool pins make findings meaningful: a red wholesale run means
      # the tree drifted, never that a linter released overnight.
      - name: Install shellcheck (pinned v0.10.0)
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 \
            -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          # The sha256 pin (night-total-lts-2): the asset is
          # authenticated before it is extracted - the bootstrap's
          # "the bytes are the pin" contract, carried over.
          SC_SHA="6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87"
          echo "${SC_SHA}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m755 /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version | head -2

      - name: Install shfmt (pinned v3.10.0)
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 \
            -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          # The sha256 pin (night-total-lts-2), same contract.
          SHFMT_SHA="1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc"
          echo "${SHFMT_SHA}  /tmp/shfmt" | sha256sum -c -
          sudo install -m755 /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      - name: Install yamllint, codespell, actionlint (pinned)
        run: |
          python3 -m pip install --user yamllint==1.38.0 codespell==2.4.3
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 \
            -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          # The sha256 pin (night-total-lts-2), same contract.
          AL_SHA="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          echo "${AL_SHA}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          sudo install -m755 /tmp/actionlint /usr/local/bin/actionlint
          yamllint --version
          codespell --version
          actionlint --version

      - name: Install b3sum (pinned 1.8.7)
        run: |
          B3SUM_VERSION="1.8.7"
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 10 --retry-max-time 300 --connect-timeout 15 \
            -o /tmp/b3sum \
            "https://github.com/BLAKE3-team/BLAKE3/releases/download/${B3SUM_VERSION}/b3sum_linux_x64_bin"
          # The sha256 pin (night-total-lts-2): the bytes are the pin,
          # the same contract as shellcheck, shfmt, and actionlint.
          B3SUM_SHA="5519d827b4ac438e2492e0b99e19484fa5191d34fc20b0174ebe41d3dbf9eca1"
          echo "${B3SUM_SHA}  /tmp/b3sum" | sha256sum -c -
          sudo install -m755 /tmp/b3sum /usr/local/bin/b3sum
          b3sum --version

      # The wholesale run: all 18 sections in one shot - exit code 0
      # or the push is blocked.
      - name: Run gate-keepers.sh (wholesale)
        run: bash scripts/gate-keepers.sh
        env:
          # Section 17's strict actions-pin verdict needs the API quota
          # the runner's own token carries (read-only; the sweep sends it
          # as a Bearer header and never writes it anywhere).
          GITHUB_TOKEN: ${{ github.token }}
