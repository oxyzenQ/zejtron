# =============================================================================
# Dragon Guard - Miri - undefined-behavior verification of the pure-Rust core
# =============================================================================
#
# The sibling's mature shape ported whole: the runner logic lives in
# the repo (scripts/lib/miri.sh, dispatched by ./scripts/build.sh
# miri), and this workflow only installs the toolchain and calls it.
# One implementation, two surfaces: a contributor runs the same
# command locally, and the stamp file contract (target/miri-stamp)
# means CI's verdict and the local banner read from the same source
# of truth.
#
# Scope: miri interprets every instruction, so the full test suite
# would take 30+ minutes and several test families spawn external
# binaries (uname, systemctl, journalctl, curl) or read host files -
# shapes miri cannot run. The runner restricts to the five pure-Rust
# families (the civil clock, the color ladder, the version report
# contract, the clap parsing pins, the argument guardrails) - the
# string/math/logic core where an unsafe-adjacent refactor would
# first lie. The audited-families list lives in MIRI_AUDIT_MODULES
# (scripts/lib/miri.sh), not here.
#
# The containment contract (the sibling zylaxion's night-dinner-6,
# ported after that estate's miri incident): on the sibling, a miri
# run hung past 30 minutes with 93% of its wall clock inside FIVE
# tests - two full-text README/CHANGELOG doc-assertion scans (~23
# minutes interpreted) and three sample-loop render tests (~6
# minutes). All five are pure safe code with no pointer/borrow
# surface, so the fix carried #[cfg_attr(miri, ignore = ...)] on
# each (the night-guard-1 pattern, the reason spelled out) while
# they keep running NATIVELY in every other lane. Two rules ride
# here:
#   - The admission law: the audited families are the pointer/
#     alloc/UB surface, not the docs lane. zejtron's five families
#     carry no docs-scan or unbounded-loop test today (verified
#     2026-10-21 against the 15-run measured record: the
#     interpreted step lands in 2.1-3.8 minutes); a test that
#     full-text scans README/CHANGELOG or burns an unbounded
#     numeric/render loop must never enter them without
#     #[cfg_attr(miri, ignore = "reason")] - natively it still
#     runs everywhere else (ci.yml and the E2E battery own the
#     docs assertions and the math loops).
#   - The fail-fast cap: the job timeout below is sized to that
#     measured record (the sibling's ~5x formula), not inherited -
#     a future burden test that inflates the run dies loudly
#     inside the budget instead of hanging the runner.
#
# Weekly cadence mirrors the sibling contract: miri is slow and
# nightly-only, so it is not on the per-PR critical path - the push
# filter catches Rust-surface changes the same week, and the Sunday
# run (00:00 UTC / 07:00 WIB) picks up whatever slipped through.
# The `--no-install` flag is the CI contract: this workflow installs
# its own pinned toolchain below, so a missing component must fail
# loudly rather than silently download a moving nightly.

name: zejtron - Miri

'on':
  push:
    branches: ["main"]
    paths:
      - '**/*.rs'
      - '**/*.toml'
      - '**/Cargo.lock'
      - '.cargo/**'
      - 'scripts/**'
      - '.github/workflows/miri.yml'
  pull_request:
    branches: ["main"]
    paths:
      - '**/*.rs'
      - '**/*.toml'
      - '**/Cargo.lock'
      - '.cargo/**'
      - 'scripts/**'
      - '.github/workflows/miri.yml'
  schedule:
    # Sunday 00:00 UTC (07:00 WIB) - picks up the week's commits in
    # one shot, the sibling cadence.
    - cron: '0 0 * * 0'
  # Manual trigger from the Actions tab.
  workflow_dispatch:

# Least privilege: the job only reads the repo.
permissions:
  contents: read

# Rapid pushes to the same ref cancel the superseded run instead of
# queueing a duplicate miri build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Deliberately NO RUSTFLAGS=-D warnings here: the miri build is not
  # the warning-gated lane (ci.yml owns that contract).

jobs:
  miri:
    name: Dragon Guard - Miri UB verification (5 pure-Rust families)
    runs-on: ubuntu-24.04
    # Sized to the measured record, not inherited (the sibling
    # zylaxion's night-dinner-6 formula): the interpreted step's
    # 15-run record is 2.1-3.8 min (2026-10-19/20, all green), so
    # 20 gives ~5x headroom before a runaway interpreted run burns
    # the runner. Not a speed claim - a fail-fast line: a future
    # docs-scan or unbounded-loop test that inflates the run past
    # this boundary fails loudly instead of hanging (see the
    # header's admission law).
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin

      # The runner's own toolchain: the moving `nightly` tag with the
      # miri component - exactly what `./scripts/build.sh miri` would
      # auto-install locally. The +nightly override in the runner wins
      # over the rust-toolchain.toml stable pin by construction.
      - name: Install nightly + miri (the runner's own toolchain)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: nightly
          components: miri

      # The eBPF support is unconditional (night-weekly-maintenance-1):
      # the miri build compiles the whole crate, and the build.rs
      # preflight hard-requires the toolchain pair before any compile
      # time is spent (the dormant --no-default-features graph this
      # lane rode before night-weekly-maintenance-1 no longer exists).
      # The bootstrap installs the dated nightly pin, bpf-linker, and
      # the pinned b3sum - the same step the CI and CodeQL lanes run.
      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Miri verification (stamp + log land in target/)
        run: ./scripts/build.sh miri --no-install

      # The failure evidence outlives the runner: the interpreted log
      # (which test, which allocation, which borrow) plus the stamp
      # that says which commit failed.
      - name: Upload Miri log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7, SHA pin
        with:
          name: miri-log
          path: |
            target/miri-log.txt
            target/miri-stamp
          retention-days: 30
