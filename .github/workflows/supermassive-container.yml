#
# Supermassive Container E2E (the sibling's lane name, zejtron's
# honest version): the read-only surfaces verified inside a REAL
# container, because "zejtron works in a container" is a claim the
# doctor makes (the container detection check) and the host battery
# can never prove. The lane builds the static musl binary, runs it
# inside a docker container, and asserts the container-honest
# behavior: the doctor reports the container evidence, procfs reads
# still work, and every read-only surface exits clean.
#
# The BPF side of the sibling's lane has no zejtron analog here:
# this lane's docker is unprivileged by design (a container root
# without CAP_BPF/CAP_PERFMON reads honestly as incapable - the
# doctor's own caps law), and the eBPF lane's privileged attach
# belongs to the host kernel, not a container namespace. The binary
# this lane tests still ships the full eBPF lane (the feature is
# unconditional by owner law, Cargo.toml - see the source-built
# prerequisites below), so the lane asserts the honest
# container-side rendering: the [eBPF] section renders with the
# container's own facts, never a fake attach (night-total-lts-2
# rewrote the stale "pure procfs/sysfs reader" claim this paragraph
# used to carry - it predates the eBPF lane and had drifted).

name: zejtron - Supermassive Container E2E

# Trigger discipline (the owner's unfiltered-CI simplification): the
# estate-wide path spelling and the branch scoping are retired
# together - every push (any branch, any tag) and every pull request
# (any base) burn the container lane, plus the manual dispatch. The
# publish lanes are the only filtered seats left in the estate, and
# theirs is a tag trigger (v*), not a path filter.
'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

jobs:
  container-e2e:
    name: Container E2E - docker (musl static)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: "1.98.1"
          targets: x86_64-unknown-linux-musl

      # The ebpf feature is the default (night-improve-5): the build is
      # the source-built lane host-side (the musl target does not
      # change the build script's host), so the prerequisites ride the
      # tree's bootstrap (the zylaxion CI precedent).
      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin
        with:
          cache-on-failure: true

      - name: Build the static musl binary
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl

      # The container round trip: the binary rides a scratch-like
      # image, reads the container's own /proc and sysfs, and must
      # behave exactly as the doctor's container-detection contract
      # promises: evidence found, no crash, exit codes clean.
      #
      # The substrate pin (night-total-lts-2): every action in this
      # estate rides a SHA pin and every tool a version pin - the
      # container substrate rides the same discipline. alpine:3.20
      # is pinned by its multi-arch manifest digest so the test
      # substrate is reproducible, not whatever the floating tag
      # points at on the day a lane runs. Refresh deliberately (the
      # actions-pin law): `docker manifest inspect alpine:3.20` (or
      # the Hub registry API), then update the digest in this same
      # commit - a silent tag drift is exactly the supply-chain
      # surface the pin removes.
      - name: Run the read-only surfaces inside docker
        run: |
          set -euo pipefail
          docker build -t zejtron-e2e -f- . <<'DOCKERFILE'
          FROM alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          COPY target/x86_64-unknown-linux-musl/release/zejtron /usr/local/bin/zejtron
          DOCKERFILE

          echo "=== -V report inside the container ==="
          docker run --rm zejtron-e2e zejtron -V

          echo "=== doctor inside the container (container evidence expected) ==="
          set +e
          DOC_OUT=$(docker run --rm zejtron-e2e zejtron doctor 2>&1)
          DOC_RC=$?
          set -e
          echo "${DOC_OUT}"
          # The container markers MUST be detected (/.dockerenv or
          # cgroup evidence) - a "bare-metal" verdict inside docker is
          # a detection regression. A FAIL verdict (procfs unreadable)
          # exits non-zero by contract and fails this lane; WARN-only
          # is the honest container posture.
          if ! grep -q "container" <<<"${DOC_OUT}"; then
            echo "::error::doctor did not report container evidence inside docker"
            exit 1
          fi
          if [ "${DOC_RC}" -ne 0 ]; then
            echo "::error::doctor exited ${DOC_RC} inside the container (a FAIL row landed)"
            exit 1
          fi
          # The [eBPF] section is the binary's unconditional contract
          # (the feature is always on by owner law): inside the
          # container it must render with the container's own facts -
          # the values are host facts, the section's presence is the
          # contract. A missing section inside docker is a rendering
          # regression the host battery cannot catch (night-total-lts-2).
          if ! grep -qF "[eBPF]" <<<"${DOC_OUT}"; then
            echo "::error::doctor did not render the [eBPF] section inside the container"
            exit 1
          fi

          echo "=== the read-only surfaces inside the container ==="
          docker run --rm zejtron-e2e zejtron port --tcp --no-pid
          docker run --rm zejtron-e2e zejtron proc --me --depth 1 --no-pid
          docker run --rm zejtron-e2e zejtron net
          docker run --rm zejtron-e2e zejtron why /etc/resolv.conf

          echo "Container E2E complete: every read-only surface behaved."
