---
name: zejtron - Dependency Maintenance

"on":
  schedule:
    # night-improve-34: every Monday at 00:00 UTC (07:00 WIB) - the
    # owner's morning, one clock for every scheduled workflow. The
    # 07:00 UTC slot this file carried was the estate's second
    # clock: audit.yml and codeql.yml pin the Monday 00:00 UTC
    # cron, docs/workflow/about-ci.md documents this lane at that
    # same hour, and the sibling's maintenance lane keeps the same
    # beat. 07:00 UTC landed on 14:00 WIB - drift, not resilience.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: maintenance-deps-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Maintenance deps weekly validate
    runs-on: ubuntu-24.04
    # The runtime budget law (docs/RULES.md): 15 is the deliberate
    # generous budget here - toolchain install, the eBPF bootstrap,
    # the rider's possible object rebuild, and the wholesale check
    # suite land in this one job.
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          # Pinned explicitly so the musl target below lands on the
          # toolchain the gate resolves (rust-toolchain.toml), not on
          # whatever the action's own default is.
          toolchain: "1.98.1"
          components: rustfmt, clippy
          # The gate builds the musl shape only (the night-badass-1 GNU
          # purge completion): the deps-validate lane runs the same
          # ./scripts/build.sh (its default verb is check-all), so the
          # musl rust-std must ride this install - without it the
          # gate's preflight refuses to start, before the first verb.
          targets: x86_64-unknown-linux-musl

      # The ebpf feature is the default (night-improve-5): the validate
      # build source-builds the kernel object, so the prerequisites
      # ride the same bootstrap the fast lane uses (the zylaxion CI
      # precedent).
      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin

      - name: Install codespell
        run: python3 -m pip install --user codespell==2.4.3

      # night-zen-1: the refresh walks every committed Cargo.toml and
      # runs cargo update in each workspace, so ebpf/ and fuzz/ ride
      # the same weekly lane as the root crate (the root-only cargo
      # update left two of the three committed lockfiles permanently
      # stale). New workspaces join the lane without touching this
      # file; target trees are excluded so cache-restored build output
      # can never join the walk.
      - name: Refresh Cargo dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r manifest; do
            echo "Refreshing $(dirname "$manifest")"
            (cd "$(dirname "$manifest")" && cargo update)
          done < <(find . -name Cargo.toml -not -path '*/target/*' | sort)

      # night-zen-2: the parity rider (the zelynic sweep fix, ported).
      # A sweep that moves ebpf/Cargo.lock changes the ebpf/ tree hash,
      # so the prebuilt manifest pin lags and a lock-only artifact
      # would ship a stale lane - exactly the 9708883 second-order
      # effect (the pairing gate lives in the pre-commit hook, and the
      # ephemeral bot runner carries no hook). Right after the manifest
      # walk, where the eBPF toolchain already lives: the ONE WRITER's
      # read-only verdict first, the writer only when the pin lags, and
      # a writer failure fails the job - a sweep never ships a lane it
      # cannot prove.
      - name: Carry the prebuilt lane (parity rider)
        shell: bash
        run: |
          set -Eeuo pipefail
          if ./scripts/dev/regenerate-ebpf-prebuilt.sh --check; then
            echo "Prebuilt lane already in parity with the ebpf/ tree"
          else
            echo "Prebuilt pin lags the swept tree - the ONE WRITER rebuilds"
            ./scripts/dev/regenerate-ebpf-prebuilt.sh
          fi

      # night-zen-2: the allow-list widens to exactly the paths the
      # sweep owns - every workspace lockfile plus the prebuilt lane
      # the parity rider just proved - so the staging wall keeps its
      # shape.
      - name: Enforce dependency-only diff
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies are already up to date"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '(^|/)Cargo\.lock$|^ebpf-prebuilt/' /tmp/changed-files.txt; then
            echo "::error::Auto-update may only modify Cargo.lock files and the ebpf-prebuilt lane"
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Run checks
        if: steps.changes.outputs.changed == 'true'
        run: ./scripts/build.sh

      # night-zen-2: the artifact is the validated dependency lane -
      # every workspace lockfile plus the prebuilt lane the rider just
      # proved (the ! target negation keeps cache-restored build output
      # out; the globs pick up future workspaces without touching this
      # file). The commit job has no toolchain and must never rebuild.
      - name: Upload validated dependency lane
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7, SHA pin
        with:
          name: validated-dependency-lane
          path: |
            **/Cargo.lock
            ebpf-prebuilt/**
            !**/target/**
          if-no-files-found: error

  commit:
    name: Maintenance deps weekly commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: validate
    if: needs.validate.outputs.changed == 'true'
    permissions:
      contents: write

    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          ref: ${{ env.DEFAULT_BRANCH }}
          fetch-depth: 0

      # night-zen-1 hotfix law, widened by night-zen-2: the artifact
      # lands OUTSIDE the work tree (RUNNER_TEMP), never in an in-tree
      # staging directory - an in-tree download once let the commit job
      # sweep a .auto-update/ lockfile tree straight into the repo
      # (the bot commit 9708883 incident, recorded in
      # docs/MAINTENANCE.md). The artifact now carries the whole
      # validated lane: every workspace lockfile plus ebpf-prebuilt/.
      - name: Download validated dependency lane
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8, SHA pin
        with:
          name: validated-dependency-lane
          path: ${{ runner.temp }}/validated-dependency-lane

      - name: Maintenance deps weekly commit
        shell: bash
        run: |
          set -Eeuo pipefail
          # night-zen-2: restore the validated lane from the
          # out-of-tree artifact - every workspace lockfile by copy,
          # the prebuilt lane by rsync --delete so a retired object
          # cannot linger in the checkout. --checksum defeats the
          # size+mtime quick check: the lane is tiny, and a same-size
          # same-mtime content change (a fresh checkout and a fresh
          # download land in the same second) must never be silently
          # skipped. Staging stays exact-path: the walked lockfiles
          # plus the lane, never a glob (the 9708883 staging-leak
          # law).
          lane_dir="${RUNNER_TEMP}/validated-dependency-lane"
          find "$lane_dir" -name Cargo.lock -type f | while IFS= read -r artifact_file; do
            rel="${artifact_file#"$lane_dir"/}"
            cp "$artifact_file" "$rel"
          done
          rsync -a --delete --checksum "$lane_dir/ebpf-prebuilt/" ebpf-prebuilt/

          if git diff --quiet; then
            echo "Validated lane is already current"
            exit 0
          fi

          git diff --name-only | tee /tmp/changed-files.txt
          if grep -vE '(^|/)Cargo\.lock$|^ebpf-prebuilt/' /tmp/changed-files.txt; then
            echo "::error::Commit job may only modify Cargo.lock files and the ebpf-prebuilt lane"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          # The exact lockfile paths from the manifest walk plus the
          # prebuilt lane - the set the validate job proved, nothing
          # else can match.
          find . -name Cargo.lock -type f -not -path '*/target/*' \
            | xargs -0 -r git add --
          # The prebuilt lane rides as a directory: rsync --delete may
          # have retired files there, and only a directory add stages
          # the deletions beside the modifications.
          git add -- ebpf-prebuilt
          git commit -m "chore(deps): maintenance deps weekly"
          git push origin "HEAD:${DEFAULT_BRANCH}"
