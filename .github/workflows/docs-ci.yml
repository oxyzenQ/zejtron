---
name: zejtron - Docs CI

"on":
  push:
    paths:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
      - 'LICENSE'
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
      - 'LICENSE'

# One run per ref (the estate's concurrency shape).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Docs Spelling Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install codespell
        run: python3 -m pip install --user codespell

      - name: Check documentation files
        run: |
          find . -type f \( -name '*.md' -o -name '*.txt' \
            -o -name '*.rst' \) -print0 \
            | xargs -0r codespell
