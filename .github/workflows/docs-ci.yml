---
name: zejtron - Docs CI

"on":
  push:
    # night-improve-35: the estate's branch law - every workflow
    # scopes its push and pull_request triggers to main
    # (gate-keepers.yml, ci.yml, the audit lanes all carry the
    # same spelling). Without it this lane also woke for tag
    # pushes and side-branch pushes, runs with no merge decision
    # behind them.
    branches:
      - main
    paths:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
      - 'LICENSE'
  pull_request:
    branches:
      # Same branch law as push (the no-drift rule).
      - main
    paths:
      # Same paths as push (the no-drift rule).
      - '**/*.md'
      - '**/*.txt'
      - '**/*.rst'
      - 'LICENSE'

# One run per ref (the estate's concurrency shape).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Docs Spelling Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install codespell
        run: python3 -m pip install --user codespell

      - name: Check documentation files
        run: |
          find . -type f \( -name '*.md' -o -name '*.txt' \
            -o -name '*.rst' \) -print0 \
            | xargs -0r codespell
