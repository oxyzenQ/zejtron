---
name: zejtron - Docs CI

# No filters of any kind (the owner's unfiltered-CI simplification):
# the branch law and the docs-path filter are retired together - every
# push (any branch, any tag) and every pull request (any base) burn
# the spelling lane. The publish lanes are the only filtered seats
# left in the estate, and theirs is a tag trigger (v*), not a path
# filter.
"on":
  push:
  pull_request:

# One run per ref (the estate's concurrency shape).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: Docs Spelling Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install codespell
        run: python3 -m pip install --user codespell==2.4.3

      - name: Check documentation files
        run: |
          find . -type f \( -name '*.md' -o -name '*.txt' \
            -o -name '*.rst' \) -print0 \
            | xargs -0r codespell
