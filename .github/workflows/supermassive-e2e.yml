# =============================================================================
#
# zejtron - SUPERMASSIVE E2E (the surface lane; the sibling's suite
# name, zejtron's own depth contract).
#
# The contract: every surface, every flag, every error path,
# exercised against the REAL compiled binary, on two legs - the
# low-spec leg (the MSRV floor, 60s wall budget) and the best-spec
# leg (the stable frontier, 300s wall budget). Both legs run the
# IDENTICAL suite and the IDENTICAL check depth: the budget buys
# headroom, never depth. The depth is owned by
# scripts/supermassive/ (its README is the contract's home); this
# file only makes the legs run on every push that touches the code
# surface.
#
# Why a separate lane from supermassive.yml: that lane owns the
# toolchain-span x shape cross (the MSRV/stable frontier
# crossed with the host and musl-static shapes); this lane owns the per-surface end-to-end
# depth (success + error + determinism + color tri-tests per
# surface). Two contracts, two lanes - neither reduces the other,
# and the existing lane's name and matrix stay untouched.
#
# The third job is the titled showcase lane (the owner's visibility
# ask): the server incident simulation as its own named check in the
# checks list. The two legs above already run the simulation inside
# the full suite - the named lane adds zero depth and zero scenario
# variance (the same surface function, the same rogue, the same
# assertions); it renders the existing scenario visible, the way
# the release page renders the binary. It is the best leg's suite
# filtered to the one surface (--surfaces simulation, the documented
# filter), on the stable toolchain, with the best leg's cache
# prefix - the same toolchain, the same build shape, one cache, no
# third cold build.
#
# Build shape: each leg builds the pro-linux-amd64-v3-musl alias -
# the release page's amd64-v3 shape, never a bare `cargo build
# --release` (the owner's from-source law: the binary the depth
# suite exercises is the binary the release ships, and the parity
# gate scripts/gates/check-release-parity.sh binds the alias's -C
# tokens to the release matrix's rustflags verbatim). The alias
# links through rust-lld, the linker the pinned toolchain ships, so
# the lane needs no musl-tools package - only the musl rust-std
# target the toolchain step installs. The ebpf
# support is the binary's unconditional law (there is no dormant
# build, by owner law: Cargo.toml's night-weekly-maintenance-1
# made aya a plain dependency and no build flag can produce a
# dormant binary). The lane-honesty checks in the suite pin the
# honest unavailability rendering on unprivileged/old-kernel
# runners instead - see scripts/supermassive/README.md.
#
# Trigger discipline (the owner's unfiltered-CI simplification):
# every push (any branch, any tag) burns this lane - no path filter,
# no branch filter, the same blind posture every push-triggered lane
# in the estate now carries. The estate-wide spelling's sync tax
# across every build workflow cost more than the runner minutes it
# saved. workflow_dispatch stays as the manual recovery lane. No
# pull_request trigger on purpose: the fast lane (ci.yml) owns PRs;
# a failing surface leg lands on main and pages the owner, the same
# shape the other heavy lanes carry.
#
# The jobs fail on any FAIL (the suite's exit code is trustworthy:
# 0 = all passed or skipped-with-reason; 1 = any failure or a
# breached wall budget). SKIP appears only when the sandbox genuinely
# cannot run a check, and every SKIP names its reason in the log -
# a bare SKIP is a bug.

name: zejtron - Supermassive E2E

"on":
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supermassive-low:
    # Low specs = the MSRV floor (the estate's envelope vocabulary,
    # night-improve-31): the oldest toolchain zejtron promises to run
    # on, 60s wall budget inside the leg script.
    name: supermassive e2e - low specs (MSRV)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install Rust (1.98.1, the MSRV floor)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: "1.98.1"
          targets: x86_64-unknown-linux-musl

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin
        with:
          prefix-key: supermassive-e2e-low

      - name: Build the pro-v3 binary (the release amd64-v3 shape)
        run: cargo pro-linux-amd64-v3-musl --locked

      - name: Run the low leg (60s wall budget, full depth)
        run: |
          ./scripts/supermassive/legs/low.sh \
            --bin target/x86_64-unknown-linux-musl/pro-linux-amd64-v3-musl/zejtron

      - name: Leg verdict
        if: always()
        env:
          LEG_STATUS: ${{ job.status }}
        run: |
          {
            echo "| leg | toolchain | shape | verdict |"
            echo "|-----|-----------|-------|---------|"
            echo "| supermassive e2e - low specs | 1.98.1 (MSRV) | pro-v3-musl (ebpf always-on) | ${LEG_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

  supermassive-best:
    # Best specs = the stable frontier (the estate's envelope
    # vocabulary): the moving stable channel at full optimization,
    # 300s wall budget inside the leg script. Same suite, same depth.
    name: supermassive e2e - best specs (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install Rust (stable, the moving frontier)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin
        with:
          prefix-key: supermassive-e2e-best

      - name: Build the pro-v3 binary (the release amd64-v3 shape)
        run: cargo pro-linux-amd64-v3-musl --locked

      - name: Run the best leg (300s wall budget, full depth)
        run: |
          ./scripts/supermassive/legs/best.sh \
            --bin target/x86_64-unknown-linux-musl/pro-linux-amd64-v3-musl/zejtron

      - name: Leg verdict
        if: always()
        env:
          LEG_STATUS: ${{ job.status }}
        run: |
          {
            echo "| leg | toolchain | shape | verdict |"
            echo "|-----|-----------|-------|---------|"
            echo "| supermassive e2e - best specs | stable | pro-v3-musl (ebpf always-on) | ${LEG_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"

  supermassive-simulation:
    # The titled showcase lane: the server incident simulation as its
    # own named check. The legs above already run it inside the full
    # suite; this lane adds no depth - it renders the scenario
    # visible. The best leg's suite, filtered to the one surface, on
    # the stable toolchain, sharing the best leg's cache prefix (the
    # same toolchain and build shape - one cache, no third cold
    # build).
    name: supermassive e2e - server simulation (stable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install Rust (stable, the moving frontier)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin
        with:
          prefix-key: supermassive-e2e-best

      - name: Build the pro-v3 binary (the release amd64-v3 shape)
        run: cargo pro-linux-amd64-v3-musl --locked

      - name: Run the server incident simulation (one surface, full depth)
        run: |
          ./scripts/supermassive/legs/best.sh \
            --bin target/x86_64-unknown-linux-musl/pro-linux-amd64-v3-musl/zejtron \
            --surfaces simulation

      - name: Leg verdict
        if: always()
        env:
          LEG_STATUS: ${{ job.status }}
        run: |
          {
            echo "| leg | toolchain | shape | verdict |"
            echo "|-----|-----------|-------|---------|"
            echo "| supermassive e2e - server simulation | stable | pro-v3-musl (ebpf always-on) | ${LEG_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
