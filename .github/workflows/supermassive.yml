---
# Copyright (C) 2026 rezky_nightky
# SPDX-License-Identifier: GPL-3.0-only
# =============================================================================
#
# zejtron - SUPERMASSIVE (the heavy lane; the name is the sibling
# project's: zelynic's .github/workflows/supermassive.yml, sized to
# this repo's honest physics).
#
# The contract: every build shape the repo ships is verified end to
# end - the pinned MSRV floor and the stable frontier, each crossed
# with the host runner lane and the musl-static release shape - and
# every leg runs the SAME canonical CLI battery, not a compile-and-
# shrug. The gap this lane closes honestly: release.yml builds the
# release shapes but the runtime battery (scripts/build.sh's smoke
# and error-path sweep) must run against the exact binary the release
# page ships, not only against the host build.
# Here the battery runs per leg with ZEJTRON_BIN_PATH pointed at the
# leg's own binary, so "it compiles" is never the whole claim.
#
# Toolchain span: the MSRV legs pin 1.98.1 - the same version
# rust-toolchain.toml and Cargo.toml's rust-version pin, verified on
# its own instead of assumed from a stable-lane pass. The stable
# legs ride the moving frontier so a future stable that breaks the
# tree is caught here before the pin's next bump. The libc span
# mirrors the release matrix verbatim: the musl legs install
# musl-tools exactly as release.yml does, so the exercised shape is
# the shipped shape.
#
# RUSTUP_TOOLCHAIN is the span's enforcement: without it, rustup's
# directory override (rust-toolchain.toml pins 1.98.1) silently
# reroutes EVERY in-repo cargo call to the MSRV channel - the
# "best specs" legs were testing 1.98.1 under a stable name, and
# the best-specs musl leg died in E0463 because that auto-installed
# MSRV channel carries no musl rust-std. Pinning the env var beats
# the override by rustup's own precedence, so a leg's declared
# toolchain is the toolchain that actually runs.
#
# Trigger discipline (the owner's unfiltered-CI simplification, on
# top of night-improve-28's retired clock): the estate-wide path
# filter is retired whole - every push (any branch, any tag) burns
# the wide cross, the same blind posture every push-triggered lane
# in the estate now carries. The six-glob spelling's sync tax across
# every build workflow cost more than the runner minutes it saved.
# workflow_dispatch stays as the manual recovery lane. No
# pull_request trigger on purpose: the fast lane (ci.yml) owns PRs;
# this lane's budget is for the wide cross, not per-PR churn.
#
# Budget: timeout-minutes stays generous (a wedged leg fails the leg,
# not the lane) but the lane as a whole stays off the PR path, so the
# cost lands where the owner approved it: the wide cross.
name: zejtron - Supermassive

"on":
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supermassive:
    name: ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The declared toolchain IS the running toolchain (see the
      # Toolchain span paragraph above): rust-toolchain.toml's
      # directory override loses to this env var by rustup
      # precedence, so the stable legs genuinely ride stable.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        # night-improve-31: the sibling's envelope pair, titled in the
        # reference's vocabulary - low specs is the MSRV floor (the
        # oldest toolchain zejtron promises to run on, the minimum
        # spec), best specs is the stable frontier (the moving
        # frontier at full optimization). The sibling's resource
        # envelopes size a VM boot; this lane's honest physics are
        # the toolchain span crossed with the shape lanes, so the
        # envelope IS the span. Each leg reports its own verdict.
        include:
          - title: supermassive test - low specs (host)
            toolchain: "1.98.1"
            targets: ""
          - title: supermassive test - best specs (host)
            toolchain: stable
            targets: ""
          - title: supermassive test - low specs (musl)
            toolchain: "1.98.1"
            targets: x86_64-unknown-linux-musl
          - title: supermassive test - best specs (musl)
            toolchain: stable
            targets: x86_64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.targets }}
          components: ${{ matrix.targets == '' && 'rustfmt, clippy' || '' }}

      # The host legs run the same check-all as CI's fast lane, and the
      # gate compiles the musl shape only (the GNU purge completion).
      # The target is installed for the toolchain the gate actually
      # resolves in the checkout (rust-toolchain.toml), not for the
      # rustup default - the same active-vs-default rule the dtolnay
      # targets input cannot express for a pinned checkout. Idempotent
      # when the target is already present.
      - name: Install the musl rust-std (host-leg gate target)
        if: matrix.targets == ''
        run: rustup target add --toolchain "$(rustup show active-toolchain | sed 's/ .*//')" x86_64-unknown-linux-musl

      # The ebpf feature is the default (night-improve-5): every leg
      # (host and musl) source-builds the kernel object host-side, so
      # each leg installs the prerequisites (the zylaxion CI
      # precedent).
      - name: Restore the eBPF build prerequisites cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6, SHA pin
        with:
          path: |
            ebpf/target
          key: ebpf-build-${{ runner.os }}-${{ hashFiles('ebpf/rust-toolchain.toml', 'scripts/dev/bootstrap-ebpf.sh') }}
          restore-keys: |
            ebpf-build-${{ runner.os }}-

      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin
        with:
          prefix-key: supermassive-${{ matrix.toolchain }}-${{ matrix.targets }}

      # check-all's spell lane (the same pinned codespell
      # gate-keepers.yml installs); the host legs are the check-all
      # legs, the musl legs build + battery without it.
      - name: Install codespell (the check-all gate's spell lane)
        if: matrix.targets == ''
        run: python3 -m pip install --user codespell==2.4.3

      - name: Full gate (host leg)
        if: matrix.targets == ''
        run: ./scripts/build.sh check-all -q

      # The static musl shape is built through the pro alias - the
      # release page's amd64-v3 static binary, never a bare
      # `cargo build --release --target` (the owner's from-source
      # law, night-improve-52; the parity gate binds the -C tokens
      # to the release matrix). rust-lld carries the link (the
      # pinned toolchain's own linker, the .cargo/config.toml
      # contract), so no musl-tools install rides this lane any
      # more - the dtolnay action's `targets:` input installs the
      # musl std and the alias carries the rest.
      - name: Build the static pro-v3 musl shape
        if: matrix.targets != ''
        run: cargo pro-linux-amd64-v3-musl --locked

      - name: CLI battery on the leg's own binary
        if: matrix.targets != ''
        env:
          ZEJTRON_BIN_PATH: target/x86_64-unknown-linux-musl/pro-linux-amd64-v3-musl/zejtron
        run: ./scripts/build.sh battery

      - name: Leg verdict
        if: always()
        env:
          LEG_TITLE: ${{ matrix.title }}
          LEG_TOOLCHAIN: ${{ matrix.toolchain }}
          LEG_SHAPE: ${{ matrix.targets || 'host' }}
          LEG_STATUS: ${{ job.status }}
        run: |
          {
            echo "| leg | toolchain | shape | verdict |"
            echo "|-----|-----------|-------|---------|"
            echo "| ${LEG_TITLE} | ${LEG_TOOLCHAIN} | ${LEG_SHAPE} | ${LEG_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
