# CodeQL security analysis for zejtron (the sibling's lane shape).
#
# zejtron's security surface is Rust end to end: one binary that reads
# /proc, sysfs, and the filesystem and renders to a terminal. The
# analysis is pinned to `rust` - the whole shipped surface. Shell and
# Python tooling scripts are covered by the shell quad and the
# language discipline via the wholesale gate-keepers job. The paths
# filters are retired (the owner's unfiltered-CI simplification):
# every push and pull request burns the scan - the filters' sync tax
# cost more than the runner minutes they saved.

name: zejtron - CodeQL

'on':
  push:
  pull_request:
  schedule:
    # Monday 00:00 UTC (07:00 WIB) - the owner's morning, one clock
    # for every scheduled workflow.
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RUST_VERSION: "1.98.1"

jobs:
  analyze:
    name: Dragon Guard - CodeQL Analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA pin
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # @stable, SHA pin
        with:
          toolchain: ${{ env.RUST_VERSION }}

      # The ebpf feature is the default (night-improve-5): the autobuild
      # below compiles the workspace with the source-built lane, so the
      # prerequisites ride the tree's bootstrap (the zylaxion CI
      # precedent).
      - name: Install the eBPF build prerequisites
        run: |
          ./scripts/dev/bootstrap-ebpf.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Restore-only. The CodeQL lane is a pure reader: it builds a
      # throwaway database for the scanner and nothing downstream
      # consumes its cache, so writing one is pure risk. Measured on
      # run 39278106335: once the estate's 10 GB cache budget evicted
      # this lane's entry (the 15:04 push wave re-saved seven
      # multi-GB lanes), the next run fell back to a full save - a
      # silent tar+zstd of the whole target tree plus upload that ran
      # ~27 minutes AFTER the analysis had already finished and
      # uploaded. Post steps have no per-step timeout, so the only
      # backstop was the 45-minute job timeout. save-if: false
      # removes the write entirely: the hang class cannot recur, and
      # the worst case is a cold autobuild (minutes) inside a
      # 45-minute budget.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2, SHA pin
        with:
          save-if: false

      # Pinned to rust: the security surface users run is the Rust
      # binary - the whole shipped code is Rust.
      #
      # The config file carries the standing rust/cleartext-logging
      # exclusion: a false positive on the whole product, whose output
      # is the forensic terminal print (the ps(1) disclosure class).
      # The verdict and the review condition live in SECURITY.md's
      # hardening posture; the triage lane closes anything raised
      # before the exclusion.
      #
      # codeql-action is the ONE action deliberately left on a moving
      # tag (github-org official): its value is tracking the current
      # analyzers and query packs - SHA-pinning it would freeze the
      # security scanner itself. Every other action in this repo is
      # SHA-pinned.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          config-file: .github/codeql/codeql-config.yml

      - name: Build (autobuild)
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /rust
          upload: true
