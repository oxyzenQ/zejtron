# Build defaults for the pure-Rust eBPF crate (night-improve-1, the
# zelynic/zylaxion lineage carried over verbatim). With this file in
# place the dedicated build is simply:
#
#   cd ebpf && cargo build --release
#
# How the pieces fit (verified empirically by the zelynic lineage,
# see its docs/PURE_RUST_EVALUATION.md — the validated
# toolchain/target pair carries over unchanged):
#   - [build].target selects the repo-local bpfel-unknown-none.json
#     spec clone: identical to the tier-3 builtin except
#     `atomic-cas: true`, which unblocks core's 64-bit atomic RMW
#     (fetch_add) for the SMP-safe stats counter in src/main.rs. The
#     builtin spec still carries the pre-5.12 `atomic-cas: false`
#     even though the ISA (BPF_ATOMIC, Linux 5.12+) and the verified
#     floor (5.15) both support it. The file stem keeps the artifact
#     directory at target/bpfel-unknown-none/.
#   - [unstable].build-std compiles core from source; nightly only.
#   - The target spec pins linker-flavor "bpf", so rustc invokes
#     bpf-linker from PATH as the default linker. Hiding bpf-linker
#     from PATH fails the build with "error: linker 'bpf-linker' not
#     found" — no silent fallback.
#
# BTF / debug info (aya-build parity flags) are NOT enabled by
# default: the tap uses legacy map definitions and needs no CO-RE
# introspection. Phase 1 reads no tracepoint arguments, so there is
# no context layout to introspect.
#
# night-frontier-1 measured the CO-RE frontier so this decision stays
# decision-grade rather than habit. The estate's cross-kernel
# contract is already the CO-RE shape: ONE kernel-agnostic object
# (bpfel-unknown-none, no kernel headers in the build), with the
# per-host struct offsets resolved at attach from the host's own
# /sys/kernel/btf/vmlinux (src/ebpf/btf.rs) and the attach refused
# when BTF cannot verify them - "compile once, run everywhere" via
# runtime offsets instead of load-time relocations, and strictly
# more flexible for a tap that reads kernel structs through a map.
# True compile-time CO-RE field relocations are measured-impossible
# in the rustc toolchain: with -Cdebuginfo=2 plus bpf-linker 0.11.1's
# --btf the object carries a rich .BTF and a .BTF.ext whose
# core_relo header field lands at length ZERO - rustc's frontend has
# no preserve_access_index (clang-only), so there is nothing for the
# loader to relocate. aya 0.16's loader already carries the full
# 12-kind BPF_CORE relocation engine (FieldByteOffset through
# EnumVariantValue), so the day rustc emits field relos this crate
# needs no migration. The introspection-only recipe, should a later
# pass want a type-carrying object, is measured too: the flags above
# plus llvm-objcopy --strip-debug (llvm-tools-preview; GNU objcopy
# cannot parse EM_BPF) yield a 37.4 KB object with a rich .BTF and
# zero DWARF dead weight - deliberately not enabled here, per the
# decision above.

[build]
target = "bpfel-unknown-none.json"
# The LLVM BPF backend selects the atomic RMW instructions
# (BPF_ATOMIC fetch-add, what the SMP-safe stats counter needs) only
# at cpu v3 — and v3 bytecode (alu32, kernel 5.1+) sits well inside
# the 5.15 verified floor. This applies to direct builds with a clean
# environment (cd ebpf && cargo build); when the parent build.rs
# drives this build with an inherited RUSTFLAGS env (CI's "-D
# warnings"), env shadows config — that path force-merges the same
# flag in build.rs, so both routes agree.
rustflags = ["-C", "target-cpu=v3"]

[unstable]
build-std = ["core"]
json-target-spec = true
