# The fuzz lane's workspace (night-improve-43). A separate cargo
# workspace on purpose: the fuzzer's dependency graph (libfuzzer-sys
# and its bundled runtime) never touches the main crate's Cargo.lock,
# and the main crate's stable/MSRV lanes never see the fuzzer's
# nightly-only needs. The two never build together - the root manifest
# is a single package, this directory is its own workspace root, and
# .github/workflows/fuzz.yml is the only automation that enters here.
#
# The crate under test is NOT a path dependency: zejtron is a bin-only
# crate (no lib target), and inventing one for the fuzzer's sake would
# reshape the main build the whole CI estate vets. Instead each target
# path-includes the exact parser source it protects - the harness
# compiles the same src/ebpf/btf.rs, src/ebpf/btf_writev.rs and
# src/system/ bytes the binary ships, so a guarantee the lane proves
# is a guarantee the binary carries, with no harness drift and no
# copied grammar. Every included file is std-only and crate-import-
# free - the writev verifier reaches its sibling parser through
# `super`, never through the crate - so the includes compile
# standalone, and scripts/gates/check-fuzz-includes.sh (gate 18)
# holds the law locally. The eBPF kernel-side code is deliberately
# not fuzzed:
# it runs behind the kernel verifier, not in userspace.
#
# The committed seed anchors (night-improve-50, fuzz/seeds/) ride
# the same tracked-definition law: hand-built BTF blobs the
# workflow copies into the working corpus before every run, so the
# fuzzer starts inside the parser's anonymous-descent paths from
# run one. The corpus the fuzzer grows stays untracked (the
# fuzz/.gitignore law) - a seed is a contract, a discovery is not.

[package]
name = "zejtron-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# The marker cargo-fuzz itself demands (it refuses to drive a
# manifest without it - the guard against fuzzing the wrong crate).
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "btf_parser"
path = "fuzz_targets/btf_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proc_parser"
path = "fuzz_targets/proc_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sanitize_display"
path = "fuzz_targets/sanitize_display.rs"
test = false
doc = false
bench = false

[workspace]
