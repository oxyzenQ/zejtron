# Native-CPU host build alias (sibling-project pro-native
# lineage, zelynic .cargo/config.toml).
#
# Owner contract: `cargo pro-native-musl` compiles for the host CPU
# (`-C target-cpu=native`) as a fully static musl binary. musl is
# the project's only libc shape (night-badass-1, the GNU purge):
# zero gnu builds ship and the host dev lane is static too. No
# feature flags ride the alias - zejtron is feature-free by design.
# No build-label env is needed either: version.rs's build_label()
# detects arch + libc at compile time, so `-V` names the shape
# ("linux-amd64-musl") the same way the release matrix's Build: line
# does. The separate profile name (see the [profile.pro-native-musl]
# block in Cargo.toml) lands the binary in
# target/x86_64-unknown-linux-musl/pro-native-musl/zejtron so a
# native build never clobbers target/release/zejtron.
#
# Precedence note (verified live on cargo 1.98.1, the sibling
# config's rule): target-level rustflags SHADOW build-level
# rustflags, so the alias sets
# target.x86_64-unknown-linux-musl.rustflags directly - passing
# only build.rustflags there would be silently ignored once a
# [target.*] block exists for the triple. CLI --config rustflags
# are additionally CONCATENATED with file-level target rustflags
# (not replaced), so the alias carries +crt-static explicitly and
# its native+static contract stays self-contained regardless of any
# future [target] block.
#
# aarch64 hosts: pro-native-musl is x86_64-only because cargo
# aliases cannot detect the host arch - mirror the alias with the
# aarch64 target triple if a static aarch64 native build is ever
# needed.
#
# Prerequisites: the musl rust-std target
# (`rustup target add x86_64-unknown-linux-musl`) and nothing else -
# the alias links through rust-lld, the linker the pinned toolchain
# ships, so no distro musl-tools package is required. The sibling
# config's musl [target] block pins the same linker. The alias-level
# --config linker is per-invocation: the release lane's own musl
# build (release.yml, musl-tools) is untouched.
[alias]
pro-native-musl = [
  "build",
  "--profile",
  "pro-native-musl",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=native\",\"-C\",\"target-feature=+crt-static\"]",
  "--config",
  "target.x86_64-unknown-linux-musl.linker=\"rust-lld\"",
  "--target",
  "x86_64-unknown-linux-musl",
]

# Arch-baseline release aliases (the sibling's NIGHT-improve-22
# lineage): `cargo pro-linux-amd64-v3-musl` /
# `pro-linux-amd64-v4-musl` compile the EXACT release shapes
# (release.yml builds v3 and v4; both are fully static musl -
# night-badass-1 retired the gnu pair, the release matrix ships
# musl only, and the native v1 baseline stays a local dev-only
# build via the pro-native alias above). Each alias carries its own
# profile so the two artifacts land in separate target dirs and
# never clobber each other or target/release/zejtron. No build-label
# env: version.rs's build_label() detects arch + libc at compile
# time (the night-improve-11 contract); the x86-64 level is the one
# dimension -V cannot self-detect at runtime, and it is documented
# by the artifact name the release page ships.
#
# The aliases set the target-level rustflags directly (the SHADOW
# rule documented above): a file-level target musl contract would
# ignore build-level flags, and each alias carries +crt-static
# explicitly so it stays self-contained.
#
# Parity contract (scripts/gates/check-release-parity.sh): the -C
# tokens below must equal the release matrix's rustflags verbatim -
# a one-file edit can no longer silently break that contract.
pro-linux-amd64-v3-musl = [
  "build",
  "--profile",
  "pro-linux-amd64-v3-musl",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=x86-64-v3\",\"-C\",\"target-feature=+crt-static\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]
pro-linux-amd64-v4-musl = [
  "build",
  "--profile",
  "pro-linux-amd64-v4-musl",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=x86-64-v4\",\"-C\",\"target-feature=+crt-static\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]
