# Native-CPU host build alias (sibling-project pro-native
# lineage, zelynic .cargo/config.toml).
#
# Owner contract: `cargo pro-native-musl` compiles for the host CPU
# (`-C target-cpu=native`) as a fully static musl binary. musl is
# the project's only libc shape (night-badass-1, the GNU purge):
# zero gnu builds ship and the host dev lane is static too. No
# feature flags ride the alias - zejtron is feature-free by design.
#
# night-dragon-maintenance-T1 (the estate-wide build-label contract):
# the alias stamps ZEJTRON_BUILD = "local-pro-native-musl" (the alias
# name under the `local-` marker) through cargo's [env] config, so
# `-V` names the exact alias that produced the binary instead of the
# detection fallback (which can only say local-linux-amd64-musl - it
# cannot self-detect the native codegen or the alias lane). build.rs
# forwards the env into the compile-time option_env! src/info reads
# (cargo's [env] reaches build scripts and rustc alike, but the
# crate's option_env! only sees what build.rs re-emits).
#
# Precedence note (verified live on cargo 1.98.1, the sibling
# config's rule): target-level rustflags SHADOW build-level
# rustflags, so the alias sets
# target.x86_64-unknown-linux-musl.rustflags directly - passing
# only build.rustflags there would be silently ignored once a
# [target.*] block exists for the triple. CLI --config rustflags
# are additionally CONCATENATED with file-level target rustflags
# (not replaced), so the alias carries +crt-static explicitly and
# its native+static contract stays self-contained regardless of any
# future [target] block.
#
# aarch64 hosts: pro-native-musl is x86_64-only because cargo
# aliases cannot detect the host arch. The arm64 twin is its own
# explicit alias - pro-native-arm64-musl below - mirroring this
# block onto the aarch64 target triple (the owner's arm64 mandate,
# the sibling zelynic's shape). The nested eBPF build rides the
# same BPF ISA on every host arch (the bpfel objects are
# host-arch-independent), and the pinned bpf-linker ships an
# aarch64 asset (bootstrap-ebpf.sh's own case), so the alias works
# on an arm host unmodified. build.rs strips any target-cpu=/
# target-feature= token from the nested eBPF build's environment,
# so host-native arm codegen never reaches bpf-linker either.
#
# Prerequisites: the musl rust-std target
# (`rustup target add x86_64-unknown-linux-musl`) and nothing else -
# the alias links through rust-lld, the linker the pinned toolchain
# ships, so no distro musl-tools package is required. The sibling
# config's musl [target] block pins the same linker. The alias-level
# --config linker is per-invocation: the release lane's own musl
# build (release.yml, musl-tools) is untouched.
[alias]
pro-native-musl = [
  "build",
  "--profile",
  "pro-native-musl",
  "--config",
  "env.ZEJTRON_BUILD=\"local-pro-native-musl\"",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=native\",\"-C\",\"target-feature=+crt-static\"]",
  "--config",
  "target.x86_64-unknown-linux-musl.linker=\"rust-lld\"",
  "--target",
  "x86_64-unknown-linux-musl",
]

# The arm64 twin (the owner's arm64 mandate, the sibling zelynic's
# shape): pro-native-arm64-musl mirrors pro-native-musl onto the
# aarch64 target triple - host-CPU native codegen (-C
# target-cpu=native), fully static musl (the only libc shape),
# the T1 build-label contract (`-V` names
# "local-pro-native-arm64-musl"). The artifact lands in
# target/aarch64-unknown-linux-musl/pro-native-arm64-musl/ so an
# arm build never clobbers the x86 target tree or
# target/release/zejtron. No x86-64-v3 equivalent: armv8-a IS the
# universal arm64 baseline, so target-cpu=native is the only
# codegen tier this family carries. Run on arm64 silicon
# (ubuntu-24.04-arm in CI); a cross-compile from x86_64 would
# mis-apply target-cpu=native, so the alias is a native lane, not
# a cross lane - the same law the sibling's arm64 twin carries.
pro-native-arm64-musl = [
  "build",
  "--profile",
  "pro-native-arm64-musl",
  "--config",
  "env.ZEJTRON_BUILD=\"local-pro-native-arm64-musl\"",
  "--config",
  "target.aarch64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=native\",\"-C\",\"target-feature=+crt-static\"]",
  "--config",
  "target.aarch64-unknown-linux-musl.linker=\"rust-lld\"",
  "--target",
  "aarch64-unknown-linux-musl",
]

# Arch-baseline release aliases (the sibling's NIGHT-improve-22
# lineage): `cargo pro-linux-amd64-v3-musl` /
# `pro-linux-amd64-v4-musl` compile the EXACT release shapes
# (release.yml builds v3 and v4; both are fully static musl -
# night-badass-1 retired the gnu pair, the release matrix ships
# musl only, and the native v1 baseline stays a local dev-only
# build via the pro-native alias above). Each alias carries its own
# profile so the two artifacts land in separate target dirs and
# never clobber each other or target/release/zejtron.
#
# night-dragon-maintenance-T1 (the estate-wide build-label contract):
# each alias stamps ZEJTRON_BUILD = "local-pro-<alias name>" (the
# alias name under the `local-` marker), so `-V` names the shape the
# same way the release Build: line does, arch and microarch level
# included - the detection fallback cannot self-detect the x86-64
# v3/v4 level, which is exactly why the label is stamped and not
# guessed. build.rs forwards the env into the compile-time
# option_env! src/info reads.
#
# The aliases set the target-level rustflags directly (the SHADOW
# rule documented above): a file-level target musl contract would
# ignore build-level flags, and each alias carries +crt-static
# explicitly so it stays self-contained.
#
# Parity contract (scripts/gates/check-release-parity.sh): the -C
# tokens below must equal the release matrix's rustflags verbatim -
# a one-file edit can no longer silently break that contract.
pro-linux-amd64-v3-musl = [
  "build",
  "--profile",
  "pro-linux-amd64-v3-musl",
  "--config",
  "env.ZEJTRON_BUILD=\"local-pro-linux-amd64-v3-musl\"",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=x86-64-v3\",\"-C\",\"target-feature=+crt-static\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]
pro-linux-amd64-v4-musl = [
  "build",
  "--profile",
  "pro-linux-amd64-v4-musl",
  "--config",
  "env.ZEJTRON_BUILD=\"local-pro-linux-amd64-v4-musl\"",
  "--config",
  "target.x86_64-unknown-linux-musl.rustflags=[\"-C\",\"target-cpu=x86-64-v4\",\"-C\",\"target-feature=+crt-static\"]",
  "--target",
  "x86_64-unknown-linux-musl",
]
