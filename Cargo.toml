[package]
name = "zejtron"
version = "11.0.0"
edition = "2024"
description = "Unified Linux introspection toolkit for paths, ports, processes, files, services, and diagnostics. Boring and serious."
authors = ["rezky_nightky (oxyzenQ)"]
license = "GPL-3.0-only"
repository = "https://github.com/oxyzenQ/zejtron"
readme = "README.md"
keywords = ["linux", "cli", "introspection", "processes", "diagnostics"]
# Discoverability metadata, sibling-manifest lineage. Slugs validated
# against the live registry API (2026-10-17):
# - "command-line-utilities": the primary bucket for a terminal binary.
# - "os::linux-apis": "Bindings to Linux-specific APIs" - the honest
#   bucket for a procfs/sysfs introspection tool that reads /proc and
#   sysfs directly with no external command dependencies.
# Registry limit is 5 categories; 2 used.
categories = ["command-line-utilities", "os::linux-apis"]
# MSRV, pinned to the same version as rust-toolchain.toml's channel so
# the manifest contract and the default local toolchain cannot drift.
rust-version = "1.98.1"
# documentation = "https://docs.rs/zejtron" - withheld until the crate
# is published to the registry. The docs.rs link is verified live
# before it ships (the sibling manifest's rule), and the registry
# lookup (2026-10-17, re-verified this same day) reports the crate
# does not exist yet. Add the field in the same change that publishes.
# The crates.io ship set (sibling-manifest include/exclude lineage).
# A curated allowlist beats an exclude list here: the tarball carries
# exactly what a source consumer needs and nothing else. Structural
# facts verified on this manifest:
# - src/** and build.rs are the compile surface; build.rs's only
#   repository dependency is .git/HEAD (read opportunistically for
#   the build-hash env, degraded to "unknown" in a tarball extract
#   where .git does not exist - by design, no include entry needed).
# - Cargo.lock ships so `cargo install zejtron --locked` reproduces
#   the dependency graph the release lane vetted.
# - docs/*.md is the top-level docs surface the README links into
#   (docs/ROADMAP.md, docs/ROADMAP-current.md, docs/VERIFY_RELEASE.md);
#   the docs/workflow/, docs/archive/ research subdirs and the AUR
#   packaging lane (aur/) stay repo-only - the sibling manifest's
#   lean-half rule: the repo keeps them readable, the tarball does
#   not carry them.
# - rust-toolchain.toml ships so a source consumer's default
#   toolchain matches the channel the release lane used.
# Everything NOT listed stays repo-only: CI workflows, gates, assets
# (branding, rendered at repository time - no code path reads them),
# scripts/ (dev and package lanes are maintainer tooling).
include = [
    "src/**",
    "build.rs",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "README.md",
    "LICENSE",
    "TRADEMARK.md",
    "CHANGELOG.md",
    "docs/*.md",
]
# Discovery discipline (sibling-manifest Pattern C lineage): every
# auto-discovery axis is OFF. No tests/, benches/, or examples/
# directory exists today, and these flags guarantee a stray directory
# of the same name can never silently become a build target the
# release lane did not vet. The binary is the only product; its
# behavior is exercised end-to-end by the script lanes (build.sh,
# gate-keepers) and CI, not by in-tree cargo targets.
autotests = false
autobenches = false
autoexamples = false

[dependencies]
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.40", features = ["derive"] }
ctrlc = "3.4.7"
regex-lite = "0.1"

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "thin"
codegen-units = 1
panic = "unwind"
overflow-checks = false
incremental = false

# Native-CPU host build profiles for the cargo aliases
# pro-native-gnu / pro-native-musl (.cargo/config.toml [alias]).
# Both inherit release unchanged - the only delta is the
# alias-injected -C target-cpu=native (plus +crt-static on the musl
# pair, mirroring the alias's target-level rustflags) - so alias
# binaries are bit-for-bit the same optimization tier as the release
# packages, with the host CPU's full instruction set on top. Separate
# profile names land the binaries in target/pro-native-gnu/zejtron
# and target/x86_64-unknown-linux-musl/pro-native-musl/zejtron so a
# native build never clobbers target/release/zejtron.
[profile.pro-native-gnu]
inherits = "release"

[profile.pro-native-musl]
inherits = "release"
