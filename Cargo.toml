[package]
name = "zejtron"
version = "80.0.1-zejtron.2"
edition = "2024"
description = "Read-only evidence ledger for the Linux host. Native kernel readers, eBPF event windows, zero external wrappers. Boring and serious."
authors = ["rezky_nightky (oxyzenQ)"]
license = "GPL-3.0-only"
repository = "https://github.com/oxyzenQ/zejtron"
readme = "README.md"
keywords = ["linux", "cli", "introspection", "processes", "diagnostics"]
# Discoverability metadata, sibling-manifest lineage. Slugs validated
# against the live registry API (2026-10-17):
# - "command-line-utilities": the primary bucket for a terminal binary.
# - "os::linux-apis": "Bindings to Linux-specific APIs" - the honest
#   bucket for a procfs/sysfs introspection tool that reads /proc and
#   sysfs directly with no external command dependencies.
# Registry limit is 5 categories; 2 used.
categories = ["command-line-utilities", "os::linux-apis"]
# MSRV, pinned to the same version as rust-toolchain.toml's channel so
# the manifest contract and the default local toolchain cannot drift.
rust-version = "1.98.1"
# documentation = "https://docs.rs/zejtron" - withheld until the crate
# is published to the registry. The docs.rs link is verified live
# before it ships (the sibling manifest's rule), and the registry
# lookup (2026-10-17, re-verified this same day) reports the crate
# does not exist yet. Add the field in the same change that publishes.
# The crates.io ship set (sibling-manifest include/exclude lineage).
# A curated allowlist beats an exclude list here: the tarball carries
# exactly what a source consumer needs and nothing else. Structural
# facts verified on this manifest:
# - src/** and build.rs are the compile surface; build.rs's only
#   repository dependency is .git/HEAD (read opportunistically for
#   the build-hash env, degraded to "unknown" in a tarball extract
#   where .git does not exist - by design, no include entry needed).
# - build/** rides beside build.rs (night-improve-1): the eBPF
#   staging module build.rs declares via #[path] compiles
#   unconditionally, so a registry extract without it would fail to
#   build; since night-weekly-maintenance-1 the staging is
#   unconditional - every build carries the eBPF object.
# - ebpf-prebuilt/** rides beside build/** (night-improve-5): the
#   maintainer-built kernel object plus its provenance manifest -
#   the registry lane's object source. A registry extract with the
#   build stages this object (manifest-verified, see
#   build/prebuilt.rs) instead of source-building ebpf/, so the
#   install needs no nightly and no bpf-linker on the target
#   machine. scripts/dev/regenerate-ebpf-prebuilt.sh is the lane's
#   one writer; the commit gate enforces its pins.
# - Cargo.lock ships so `cargo install zejtron --locked` reproduces
#   the dependency graph the release lane vetted.
# - docs/*.md is the top-level docs surface the README links into
#   (docs/ROADMAP.md, docs/ROADMAP-current.md, docs/VERIFY_RELEASE.md);
#   the docs/workflow/ and docs/archive/ research subdirs stay
#   repo-only - the sibling manifest's lean-half rule: the repo keeps
#   them readable, the tarball does not carry them.
# - rust-toolchain.toml ships so a source consumer's default
#   toolchain matches the channel the release lane used.
# Everything NOT listed stays repo-only: CI workflows, gates, assets
# (branding, rendered at repository time - no code path reads them),
# scripts/ (dev and package lanes are maintainer tooling), and the
# test/ tree (the single test tree, #[path]-wired from src/ - it
# compiles into the developer's cargo test run, never into a
# consumer's build).
include = [
    "src/**",
    "build.rs",
    "build/**",
    "ebpf-prebuilt/**",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "LICENSE",
    "TRADEMARK.md",
    "CHANGELOG.md",
    "docs/*.md",
    "NOTICE",
    "deny.toml",
    "CLA.md",
    "COMMERCIAL_LICENSE.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "QA.md",
    "AI_AGENTS_READ_THIS.md",
]
# Discovery discipline (sibling-manifest Pattern C lineage): every
# auto-discovery axis is OFF. No tests/, benches/, or examples/
# directory exists today, and these flags guarantee a stray directory
# of the same name can never silently become a build target the
# release lane did not vet. The binary is the only product; its
# behavior is exercised end-to-end by the script lanes (build.sh,
# gate-keepers) and CI, not by in-tree cargo targets.
autotests = false
autobenches = false
autoexamples = false

[dependencies]
# chrono dropped (the sibling's Hinnant-style lineage, night-improve-13):
# was `chrono = { version = "0.4", default-features = false,
# features = ["clock"] }` - the `clock` feature dragged iana-time-zone
# + num-traits into the lockfile for two timestamp-formatting call
# sites. Wall-clock rendering is computed by Howard Hinnant's
# civil_from_days algorithm directly (src/clock.rs and build.rs,
# http://howardhinnant.github.io/date_algorithms.html) - no time
# crate, std only, UTC with an explicit marker. The deny.toml bans
# section (night-improve-12) blocks re-adding it in CI.
clap = { version = "4.5.40", features = ["derive"] }
regex-lite = "0.1"
# night-improve-1, the eBPF lane: aya 0.14 is the userspace loader,
# and since night-weekly-maintenance-1 it rides UNCONDITIONALLY (no
# feature toggle) - the registry install lands the full-featured
# binary through the prebuilt lane (see the note below the
# dependencies). It is the upstream
# pairing of the ebpf/ crate's aya-ebpf
# 0.2.1 (the validated pair the zelynic and zylaxion lineages build
# on): loads the embedded object, attaches the tracepoint, pins and
# reads the maps. libc is deliberately NOT pulled in: every Phase 1
# kernel fact is readable through std fs (/proc/sys/kernel/osrelease,
# /proc/self/status CapEff, /sys/kernel/security/lockdown) and aya's
# typed API covers the rest - an unused dependency would violate the
# dependency policy; a later pass that needs a raw syscall adds it
# feature-gated, one line.
aya = { version = "0.14" }

# The eBPF support is UNCONDITIONAL (night-weekly-maintenance-1, the
# owner's "always enable, permanent" law): night-improve-5 made `ebpf`
# the default feature, this pass removes the toggle entirely - aya is
# a plain dependency, there is no [features] table, and no build flag
# can produce a dormant binary. On a git checkout the loader embeds
# the source-built object (the nested nightly build build.rs drives);
# on a registry tarball it embeds the maintainer-built object staged
# from ebpf-prebuilt/ (manifest-verified, provenance in
# ebpf-prebuilt/manifest.toml) - either way the install needs NO
# nightly toolchain and no bpf-linker on the target machine. The
# doctor reports the lane honestly in every build.

# night-dragon-6, the UNIX pipe law: SIGPIPE must kill the process the
# UNIX way (silent, exit 141) when a piped consumer (jq, head) closes
# early - never a Rust print panic with a backtrace. std has no signal
# API; this is the escape hatch the policy note above aya reserved
# ("a later pass that needs a raw syscall adds it feature-gated, one
# line") arriving at its first raw syscall. Unix-gated (the crate is
# Linux-only anyway), one call site: the SIG_DFL reset at main's top.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "thin"
codegen-units = 1
panic = "unwind"
overflow-checks = false
incremental = false

# Native-CPU host build profile for the cargo alias
# pro-native-musl (.cargo/config.toml [alias]). It inherits release
# unchanged - the only delta is the alias-injected -C target-cpu=native
# (plus +crt-static, mirroring the alias's target-level rustflags) - so
# the alias binary is bit-for-bit the same optimization tier as the
# release packages, with the host CPU's full instruction set on top.
# The separate profile name lands the binary in
# target/x86_64-unknown-linux-musl/pro-native-musl/zejtron so a
# native build never clobbers target/release/zejtron.
[profile.pro-native-musl]
inherits = "release"

# Arch-baseline release profiles for the cargo aliases
# pro-linux-amd64-v3-musl / pro-linux-amd64-v4-musl
# (the sibling's NIGHT-improve-22 lineage; see .cargo/config.toml
# [alias]). They inherit release unchanged - the only delta is the
# alias-injected -C target-cpu=x86-64-v3/v4 (plus +crt-static,
# mirroring the file's [target] block) - so alias binaries
# are bit-for-bit the same optimization tier as the release packages
# they reproduce. Separate profile names exist so the two artifacts
# land in target/x86_64-unknown-linux-musl/<profile>/ and never
# clobber each other or target/release/zejtron. v3/v4 are the ONLY
# release shapes: the release matrix builds exactly these, and the
# native v1 baseline stays a local dev-only lane (pro-native-musl).
# night-badass-1 retired the gnu profiles with the gnu aliases: musl
# is the only libc shape the project builds.
[profile.pro-linux-amd64-v3-musl]
inherits = "release"

[profile.pro-linux-amd64-v4-musl]
inherits = "release"
